allow_embedding: false
db_schema:
  levels:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: key
      type: string
    - admin_ui: {order: 1, width: 200}
      name: territory
      target: territories
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: name
      type: string
    - admin_ui: {order: 3, width: 200}
      name: position
      type: number
    - admin_ui: {order: 4, width: 200}
      name: data
      type: simpleObject
    - admin_ui: {order: 5, width: 200}
      name: published
      type: bool
    - admin_ui: {order: 6, width: 200}
      name: updated
      type: datetime
    - admin_ui: {order: 7, width: 200}
      name: builtin
      type: bool
    - admin_ui: {order: 8, width: 200}
      name: clears
      type: number
    indexes: []
    server: full
    title: Levels
  scores:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: user
      target: users
      type: link_single
    - admin_ui: {order: 1, width: 200}
      name: level
      target: levels
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: time
      type: number
    - admin_ui: {order: 3, width: 200}
      name: stars
      type: number
    - admin_ui: {order: 4, width: 200}
      name: at
      type: datetime
    indexes: []
    server: full
    title: Scores
  territories:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: key
      type: string
    - admin_ui: {order: 1, width: 200}
      name: name
      type: string
    - admin_ui: {order: 2, width: 200}
      name: emoji
      type: string
    - admin_ui: {order: 3, width: 200}
      name: blurb
      type: string
    - admin_ui: {order: 4, width: 200}
      name: theme
      type: string
    - admin_ui: {order: 5, width: 200}
      name: pest
      type: string
    - admin_ui: {order: 6, width: 200}
      name: postcard
      type: string
    - admin_ui: {order: 7, width: 200}
      name: position
      type: number
    - admin_ui: {order: 8, width: 200}
      name: published
      type: bool
    indexes: []
    server: full
    title: Territories
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {order: 7, width: 200}
      client_hidden: false
      name: display_name
      type: string
    - admin_ui: {order: 8, width: 200}
      client_hidden: false
      name: is_admin
      type: bool
    - admin_ui: {order: 9, width: 200}
      client_hidden: false
      name: progress
      type: simpleObject
    - admin_ui: {order: 10, width: 200}
      client_hidden: false
      name: last_played
      type: datetime
    indexes: []
    server: full
    title: Users
metadata: {logo_img: 'asset:busybun.png', title: BusyBun}
name: Busy Bun
native_deps:
  head_html: |
    <!-- Busy Bun — Native Libraries. tools/sync_to_anvil.py puts this (plus lib/*.js and every form's styles and scripts)
         into anvil.yaml → native_deps.head_html. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#f7e6c8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bb-cream: #fff7ea;
        --bb-dough: #f7e6c8;
        --bb-dough-2: #f0d6a8;
        --bb-ink: #3d2416;
        --bb-ink-2: #6b4a35;
        --bb-soft: #9a7a62;
        --bb-red: #e0483a;
        --bb-red-2: #b8352a;
        --bb-gold: #f4b63c;
        --bb-gold-2: #d99417;
        --bb-green: #5e9c4a;
        --bb-green-2: #457a35;
        --bb-jade: #2e9c8f;
        --bb-blue: #3d8fd1;
        --bb-plum: #2b1b2e;
        --bb-line: #3d2416;
        --bb-shadow: 0 4px 0 #3d2416;
        --bb-radius: 18px;
        --bb-font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --bb-title: 'Fredoka', 'Nunito', system-ui, sans-serif;
        --bb-emoji: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      }
      html, body { margin: 0; padding: 0; background: var(--bb-dough); color: var(--bb-ink); font-family: var(--bb-font);
        -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      .bb, .bb * { box-sizing: border-box; }
      .bb { font-family: var(--bb-font); color: var(--bb-ink); font-size: 15px; line-height: 1.4; }
      .bb h1, .bb h2, .bb h3, .bb h4 { font-family: var(--bb-title); font-weight: 600; margin: 0; line-height: 1.15; letter-spacing: .2px; }
      .bb button { font-family: var(--bb-title); cursor: pointer; }
      .bb input, .bb select, .bb textarea { font-family: var(--bb-font); font-size: 15px; color: var(--bb-ink); }

      /* Chunky "sticker" buttons */
      .bb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--bb-line);
        background: var(--bb-gold); color: var(--bb-ink); font-weight: 600; font-size: 17px; padding: 10px 18px; border-radius: 14px;
        box-shadow: 0 4px 0 var(--bb-line); transition: transform .08s, box-shadow .08s, filter .15s; user-select: none; white-space: nowrap; }
      .bb-btn:hover { filter: brightness(1.06); }
      .bb-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--bb-line); }
      .bb-btn[disabled] { filter: grayscale(.7) opacity(.6); cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--bb-line); }
      .bb-btn.red { background: var(--bb-red); color: #fff; }
      .bb-btn.green { background: var(--bb-green); color: #fff; }
      .bb-btn.cream { background: var(--bb-cream); }
      .bb-btn.jade { background: var(--bb-jade); color: #fff; }
      .bb-btn.small { font-size: 14px; padding: 6px 12px; border-radius: 11px; border-width: 2.5px; box-shadow: 0 3px 0 var(--bb-line); }
      .bb-btn.small:active { box-shadow: 0 1px 0 var(--bb-line); transform: translateY(2px); }
      .bb-btn.big { font-size: 22px; padding: 14px 28px; border-radius: 18px; }
      .bb-btn.ghost { background: transparent; box-shadow: none; border-color: transparent; text-decoration: underline; padding: 6px 8px; }
      .bb-btn.ghost:active { transform: none; }
      .bb-card { background: var(--bb-cream); border: 3px solid var(--bb-line); border-radius: var(--bb-radius); box-shadow: var(--bb-shadow); }
      .bb-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bb-cream); border: 2.5px solid var(--bb-line);
        border-radius: 999px; padding: 3px 12px 3px 6px; font-family: var(--bb-title); font-weight: 600; box-shadow: 0 3px 0 var(--bb-line); }
      .bb-emoji { font-family: var(--bb-emoji); font-style: normal; line-height: 1; }
      .bb-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; text-align: left; }
      .bb-field label { font-weight: 800; font-size: 13px; color: var(--bb-ink-2); }
      .bb-input { width: 100%; border: 2.5px solid var(--bb-line); border-radius: 12px; padding: 10px 12px; background: #fff; outline: none; }
      .bb-input:focus { box-shadow: 0 0 0 4px rgba(244, 182, 60, .5); }
      .bb-err { color: var(--bb-red-2); font-weight: 800; font-size: 14px; min-height: 1.2em; }
      .bb-muted { color: var(--bb-soft); }

      /* Modal + toast */
      .bb-modal-bg { position: fixed; inset: 0; background: rgba(43, 27, 46, .55); display: flex; align-items: center; justify-content: center;
        z-index: 1000; padding: 16px; animation: bbFade .15s ease-out; backdrop-filter: blur(2px); }
      .bb-modal { position: relative; max-width: 520px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 22px;
        animation: bbPop .25s cubic-bezier(.2, 1.4, .4, 1); }
      .bb-modal .bb-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--bb-line);
        background: var(--bb-cream); font-size: 18px; line-height: 1; box-shadow: 0 2px 0 var(--bb-line); }
      .bb-toasts { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column;
        gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
      .bb-toast { background: var(--bb-cream); border: 3px solid var(--bb-line); border-radius: 14px; padding: 8px 16px; font-family: var(--bb-title);
        font-weight: 600; box-shadow: 0 4px 0 var(--bb-line); animation: bbDrop .3s cubic-bezier(.2, 1.4, .4, 1); text-align: center; }
      .bb-toast.err { background: #ffd9d4; }
      .bb-toast.gold { background: var(--bb-gold); }
      @keyframes bbFade { from { opacity: 0; } }
      @keyframes bbPop { from { transform: scale(.85); opacity: 0; } }
      @keyframes bbDrop { from { transform: translateY(-20px); opacity: 0; } }
      @keyframes bbBob { 50% { transform: translateY(-6px); } }
      @keyframes bbWiggle { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
      @keyframes bbSpin { to { transform: rotate(360deg); } }
      @keyframes bbPulse { 50% { transform: scale(1.08); } }
      .bb-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: var(--bb-dough); z-index: 5; font-family: var(--bb-title); font-size: 20px; }
      .bb-loading .bb-emoji { font-size: 54px; animation: bbBob .8s ease-in-out infinite; }
    </style>
    <script>
    (function () {
      'use strict';
      var BB = window.BB = window.BB || {};
      BB.components = BB.components || {};

      /* ---------- Python ⇄ JS bridge ----------
         Python mounts a component with window.BB.mount(name, rootNode, jsonString, emit).
         The component calls emit(event, payload) and gets a Promise of whatever Python returned
         (bb_ui sends it back as a JSON string; we parse it here). */
      BB.wrapEmit = function (emit) {
        return function (name, payload) {
          var r;
          try { r = emit ? emit(name, JSON.stringify(payload == null ? {} : payload)) : null; }
          catch (e) { console.error(e); return Promise.reject(e); }
          return Promise.resolve(r).then(function (v) {
            if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return v; } }
            return v;
          });
        };
      };
      BB.define = function (name, mountFn) { BB.components[name] = mountFn; };
      BB.mount = function (name, root, json, emit) {
        var fn = BB.components[name];
        if (!fn) { console.error('BB component not loaded: ' + name); return null; }
        if (!root) { console.error('BB mount: no root node for ' + name); return null; }
        var data = typeof json === 'string' ? JSON.parse(json || '{}') : (json || {});
        return fn(root, data, BB.wrapEmit(emit));
      };

      /* ---------- small helpers ---------- */
      BB.esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };
      BB.store = {
        get: function (k, dflt) { try { var v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
        set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
        del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
      };
      BB.today = function () {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      };
      BB.fmtTime = function (s) {
        if (s == null) return '–';
        s = Math.max(0, s);
        var m = Math.floor(s / 60), r = s - m * 60;
        return (m ? m + ':' + (r < 10 ? '0' : '') + r.toFixed(1) : r.toFixed(1) + 's');
      };
      BB.isTouch = function () { return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; };

      BB.toast = function (msg, kind) {
        var box = document.querySelector('.bb-toasts');
        if (!box) { box = document.createElement('div'); box.className = 'bb bb-toasts'; document.body.appendChild(box); }
        var t = document.createElement('div');
        t.className = 'bb-toast' + (kind === true || kind === 'err' ? ' err' : kind === 'gold' ? ' gold' : '');
        t.innerHTML = msg;
        box.appendChild(t);
        setTimeout(function () { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(-10px)'; }, 2600);
        setTimeout(function () { t.remove(); }, 3000);
      };

      // BB.modal(html, {onClose, cls}) → {el, close}. Clicking the backdrop or × closes it.
      BB.modal = function (html, opts) {
        opts = opts || {};
        var bg = document.createElement('div');
        bg.className = 'bb bb-modal-bg';
        bg.innerHTML = '<div class="bb-card bb-modal ' + (opts.cls || '') + '">' + (opts.noClose ? '' : '<button class="bb-x" aria-label="Close">✕</button>') + html + '</div>';
        document.body.appendChild(bg);
        var closed = false;
        function close() {
          if (closed) return; closed = true;
          bg.remove();
          document.removeEventListener('keydown', onKey);
          if (opts.onClose) opts.onClose();
        }
        function onKey(e) { if (e.key === 'Escape' && !opts.noClose) close(); }
        document.addEventListener('keydown', onKey);
        bg.addEventListener('click', function (e) {
          if ((e.target === bg && !opts.noClose) || (e.target.closest && e.target.closest('.bb-x'))) { BB.Sound.play('click'); close(); }
        });
        return { el: bg.querySelector('.bb-modal'), close: close };
      };

      /* ---------- Sound: everything is synthesized, no files ---------- */
      var Sound = BB.Sound = { ctx: null, master: null, sfxOn: BB.store.get('bb.sfx', true), musicOn: BB.store.get('bb.music', true) };
      Sound.init = function () {
        if (Sound.ctx) { if (Sound.ctx.state === 'suspended') Sound.ctx.resume(); return Sound.ctx; }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try {
          Sound.ctx = new AC();
          Sound.master = Sound.ctx.createGain(); Sound.master.gain.value = 0.5; Sound.master.connect(Sound.ctx.destination);
          Sound.musicGain = Sound.ctx.createGain(); Sound.musicGain.gain.value = 0.16; Sound.musicGain.connect(Sound.master);
        } catch (e) { Sound.ctx = null; }
        return Sound.ctx;
      };
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
        window.addEventListener(ev, function () { Sound.init(); if (Sound.wantMusic && Sound.musicOn) Sound.startMusic(Sound.wantMusic); }, { passive: true });
      });
      function tone(freq, start, dur, type, vol, slideTo, dest) {
        var c = Sound.ctx, o = c.createOscillator(), g = c.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, start);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol || 0.2, start + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g); g.connect(dest || Sound.master);
        o.start(start); o.stop(start + dur + 0.05);
      }
      function noise(start, dur, vol, filterFreq, type) {
        var c = Sound.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        var src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
        src.buffer = buf; f.type = type || 'lowpass'; f.frequency.value = filterFreq || 1200;
        g.gain.setValueAtTime(vol || 0.2, start); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        src.connect(f); f.connect(g); g.connect(Sound.master); src.start(start);
      }
      var SFX = {
        click: function (t) { tone(660, t, 0.06, 'triangle', 0.15); },
        pickup: function (t) { tone(660, t, 0.07, 'square', 0.09); tone(990, t + 0.06, 0.09, 'square', 0.09); },
        meat: function (t) { tone(520, t, 0.06, 'square', 0.1); tone(780, t + 0.05, 0.06, 'square', 0.1); tone(1040, t + 0.1, 0.1, 'triangle', 0.12); },
        coin: function (t) { tone(1320, t, 0.05, 'square', 0.07); tone(1760, t + 0.05, 0.12, 'square', 0.07); },
        dash: function (t) { noise(t, 0.22, 0.25, 2400, 'bandpass'); tone(300, t, 0.15, 'sine', 0.08, 700); },
        bonk: function (t) { tone(220, t, 0.12, 'square', 0.15, 90); noise(t, 0.08, 0.15, 900); },
        crate: function (t) { noise(t, 0.18, 0.3, 700); tone(140, t, 0.12, 'triangle', 0.15, 60); },
        hurt: function (t) { tone(400, t, 0.25, 'sawtooth', 0.12, 120); },
        nest: function (t) { noise(t, 0.35, 0.35, 500); tone(180, t, 0.3, 'square', 0.12, 50); },
        clear: function (t) { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, t + i * 0.07, 0.18, 'triangle', 0.12); }); },
        errand: function (t) { [659, 784, 988].forEach(function (f, i) { tone(f, t + i * 0.08, 0.14, 'triangle', 0.14); }); },
        talk: function (t) { tone(500 + Math.random() * 200, t, 0.05, 'triangle', 0.06); },
        unlock: function (t) { tone(392, t, 0.1, 'square', 0.1); tone(523, t + 0.1, 0.1, 'square', 0.1); tone(784, t + 0.2, 0.25, 'triangle', 0.14); },
        win: function (t) { [523, 659, 784, 659, 784, 1047].forEach(function (f, i) { tone(f, t + i * 0.11, i === 5 ? 0.5 : 0.14, 'square', 0.1); }); },
        fail: function (t) { [392, 349, 311, 262].forEach(function (f, i) { tone(f, t + i * 0.16, 0.2, 'triangle', 0.14); }); },
        cook: function (t) { noise(t, 0.9, 0.12, 3000, 'highpass'); [523, 659, 784, 1047].forEach(function (f, i) { tone(f, t + 0.4 + i * 0.09, 0.2, 'triangle', 0.12); }); },
        star: function (t) { tone(1047, t, 0.09, 'square', 0.08); tone(1568, t + 0.08, 0.2, 'triangle', 0.1); },
        steam: function (t) { noise(t, 0.5, 0.15, 3500, 'highpass'); },
        boss: function (t) { tone(110, t, 0.5, 'sawtooth', 0.15, 55); noise(t, 0.4, 0.2, 400); },
        squawk: function (t) { tone(900, t, 0.12, 'sawtooth', 0.08, 500); tone(800, t + 0.12, 0.1, 'sawtooth', 0.07, 450); }
      };
      Sound.play = function (name) {
        if (!Sound.sfxOn || !Sound.init() || !SFX[name]) return;
        try { SFX[name](Sound.ctx.currentTime + 0.005); } catch (e) {}
      };
      Sound.setSfx = function (on) { Sound.sfxOn = !!on; BB.store.set('bb.sfx', Sound.sfxOn); };
      Sound.setMusic = function (on) {
        Sound.musicOn = !!on; BB.store.set('bb.music', Sound.musicOn);
        if (on && Sound.wantMusic) Sound.startMusic(Sound.wantMusic); else Sound.stopMusic(true);
      };

      /* A tiny generative tune: pentatonic melody over a bass line, different per mood. */
      var MOODS = {
        menu: { bpm: 104, root: 60, scale: [0, 2, 4, 7, 9], wave: 'triangle', bass: [0, -5, -3, -7] },
        kitchen: { bpm: 112, root: 62, scale: [0, 2, 4, 7, 9], wave: 'triangle', bass: [0, -3, -5, -7] },
        market: { bpm: 96, root: 57, scale: [0, 3, 5, 7, 10], wave: 'square', bass: [0, -2, -4, -5] },
        dimsum: { bpm: 108, root: 64, scale: [0, 2, 4, 7, 9], wave: 'triangle', bass: [0, -5, -3, -8] },
        spice: { bpm: 122, root: 59, scale: [0, 1, 5, 7, 8], wave: 'square', bass: [0, -4, -2, -5] },
        harbour: { bpm: 92, root: 60, scale: [0, 2, 5, 7, 9], wave: 'sine', bass: [0, -5, -7, -3] },
        banquet: { bpm: 116, root: 55, scale: [0, 2, 4, 7, 9], wave: 'square', bass: [0, -3, -7, -5] }
      };
      Sound.startMusic = function (mood) {
        Sound.wantMusic = mood;
        if (!Sound.musicOn || !Sound.ctx || Sound.ctx.state !== 'running') return;
        if (Sound.music && Sound.music.mood === mood) return;
        Sound.stopMusic();
        var m = MOODS[mood] || MOODS.menu, beat = 60 / m.bpm / 2, next = Sound.ctx.currentTime + 0.1, step = 0, deg = 2;
        var timer = setInterval(function () {
          var c = Sound.ctx;
          if (!c) return;
          while (next < c.currentTime + 0.4) {
            var bar = Math.floor(step / 16) % 4;
            if (step % 4 === 0) tone(440 * Math.pow(2, (m.root - 24 + m.bass[bar] - 69) / 12), next, beat * 3.6, 'triangle', 0.22, null, Sound.musicGain);
            if (Math.random() < (step % 2 ? 0.45 : 0.8)) {
              deg = Math.max(0, Math.min(9, deg + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
              var semi = m.scale[deg % 5] + 12 * Math.floor(deg / 5);
              tone(440 * Math.pow(2, (m.root + semi - 69) / 12), next, beat * (Math.random() < 0.2 ? 1.8 : 0.9), m.wave, 0.09, null, Sound.musicGain);
            }
