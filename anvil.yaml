        // ---------- level intro
        function goalsHTML(data, info) {
          var g = data.goals || {}, out = [];
          if (g.meat) out.push([ '🥩', 'Collect ' + g.meat + ' meat' ]);
          if (g.errands && info.npcs.length) out.push(['🤝', 'Help ' + info.npcs.map(function (n) { return esc(n.name); }).join(' & ')]);
          if (g.nests && info.nests) out.push(['💥', 'Destroy ' + info.nests + ' pest nest' + (info.nests > 1 ? 's' : '')]);
          if (info.kings) out.push(['👑', 'Defeat the Rat King']);
