          });
          if (ed.grid) {
            c.strokeStyle = 'rgba(0,0,0,.13)'; c.lineWidth = 1; c.beginPath();
            for (x = 1; x < d.w; x++) { c.moveTo(x * z + 0.5, 0); c.lineTo(x * z + 0.5, d.h * z); }
            for (y = 1; y < d.h; y++) { c.moveTo(0, y * z + 0.5); c.lineTo(d.w * z, y * z + 0.5); }
            c.stroke();
          }
          d.ents.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (e) { drawEntity(c, e, (e.x + 0.5) * z, (e.y + 0.5) * z, z, 0); });
          d.ents.forEach(function (e, i) {
            if (e.t === 'npc') { c.font = '700 ' + Math.max(9, z * 0.3) + 'px Fredoka, sans-serif'; c.textAlign = 'center'; c.lineWidth = 3; c.strokeStyle = '#3d2416'; c.fillStyle = '#fff'; var lb = (e.name || '') + ' → ' + ((ITEMS[e.wants] || {}).emoji || '?') + '×' + (e.count || 1); c.strokeText(lb, (e.x + 0.5) * z, e.y * z - 2); c.fillText(lb, (e.x + 0.5) * z, e.y * z - 2); }
            if (i === ed.sel) { c.strokeStyle = '#f4b63c'; c.lineWidth = 3; c.setLineDash([5, 3]); c.strokeRect(e.x * z + 1.5, e.y * z + 1.5, z - 3, z - 3); c.setLineDash([]); }
          });
          if (drag && drag.mode === 'rect') {
            var a = drag.a, b = drag.b;
            c.fillStyle = 'rgba(244,182,60,.35)'; c.strokeStyle = '#3d2416'; c.lineWidth = 2;
            var rx = Math.min(a.x, b.x) * z, ry = Math.min(a.y, b.y) * z, rw = (Math.abs(a.x - b.x) + 1) * z, rh = (Math.abs(a.y - b.y) + 1) * z;
            c.fillRect(rx, ry, rw, rh); c.strokeRect(rx, ry, rw, rh);
          } else if (hover) {
            c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(hover.x * z + 1, hover.y * z + 1, z - 2, z - 2);
            c.strokeStyle = '#3d2416'; c.lineWidth = 1; c.strokeRect(hover.x * z + 3, hover.y * z + 3, z - 6, z - 6);
          }
        }

        // ---------- save / playtest
        function save() {
          if (!ed.territory) { BB.toast('Create a territory first.', 'err'); return; }
          var spec = { key: ed.key, territory: ed.territory, name: ed.name, published: ed.published, data: ed.data };
          call('save_level', [spec]).then(function (r) {
            if (!r || r.ok === false) { BB.toast(esc((r && r.error) || 'Could not save.'), 'err'); return; }
            setData(r);
            BB.toast(r.note ? '💾 ' + esc(r.note) : '💾 Saved' + (ed.published ? ' and published!' : ' as a draft.'), r.note ? 'err' : 'gold');
            reopen(r.saved);
          });
        }
        function playtest() {
          var th = territoryOf(ed.territory) || { theme: 'kitchen' };
          var chk = check(ed.data);
          if (chk.errors.length && chk.errors.some(function (m) { return /start|exit/.test(m); })) { BB.toast('Add a start and an exit first.', 'err'); return; }
          var wrap = document.createElement('div'); wrap.className = 'bb a-play';
          wrap.innerHTML = '<canvas></canvas><div class="hud"><span class="h"></span><span class="g"></span><span class="tm"></span><span class="sp"></span><button class="bb-btn small" data-a="restart">↻ Restart</button><button class="bb-btn small red" data-a="close">✕ Back to editor</button></div>';
          document.body.appendChild(wrap);
          var say = null;
          function startGame() {
            if (playGame) playGame.destroy();
            playGame = BB.Game(wrap.querySelector('canvas'), {
              level: ed.data, theme: th.theme, items: ITEMS, perks: [], hat: 'toque',
              onHud: function (h) {
                wrap.querySelector('.h').textContent = '♥'.repeat(Math.max(0, h.hearts)) + '♡'.repeat(Math.max(0, h.maxHearts - h.hearts));
                var g = h.goals;
                wrap.querySelector('.g').textContent = '🥩 ' + g.meat + '/' + g.meatGoal + ' · 🤝 ' + g.errandsDone + '/' + g.errandsTotal + ' · 💥 ' + (g.nestsTotal - g.nestsLeft) + '/' + g.nestsTotal + ' · 🧺 ' + h.found + '/' + h.totalItems + (g.ok ? ' · ♨️ open' : '');
                wrap.querySelector('.tm').textContent = '⏱ ' + BB.fmtTime(h.time) + ' / ' + BB.fmtTime(h.par);
              },
              onEvent: function (name, d) {
                if (name === 'toast') BB.toast(esc(d.text));
                else if (name === 'talk') { if (say) say.remove(); say = document.createElement('div'); say.className = 'say'; say.textContent = d.npc.name + ': ' + d.text; wrap.appendChild(say); }
                else if (name === 'win' || name === 'lose') {
                  var r = d.result;
                  var m = BB.modal('<div style="text-align:center"><h2>' + (name === 'win' ? 'Level complete!' : 'Squished!') + '</h2>' +
                    (r ? '<p style="font-weight:700">⏱ ' + BB.fmtTime(r.time) + ' (par ' + BB.fmtTime(ed.data.par) + ') · 🧺 ' + d.found + '/' + d.totalItems + ' ingredients · 🐀 ' + r.pests + ' pests · 💔 ' + r.damage + ' hits</p>' : '<p>Lost all hearts.</p>') +
                    '<div class="g-row" style="display:flex;gap:10px;justify-content:center"><button class="bb-btn red" data-a="again">↻ Again</button><button class="bb-btn cream" data-a="back">Back to editor</button></div></div>', { noClose: true });
                  m.el.addEventListener('click', function (e) { var a = e.target.closest('[data-a]'); if (!a) return; m.close(); if (a.dataset.a === 'again') startGame(); else close(); });
                }
              }
            });
            playGame.start();
          }
          function close() { if (playGame) playGame.destroy(); playGame = null; wrap.remove(); }
          wrap.addEventListener('click', function (e) { var a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'close') close(); else startGame(); });
          startGame();
        }

        // ------------------------------------------------------------ territories tab
        function renderTerritories(body) {
          var html = '<div class="a-page"><div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><h2 style="margin-right:auto">Territories</h2>' +
            '<button class="bb-btn small cream" data-a="restore">↺ Restore missing built-ins</button><button class="bb-btn small red" data-a="add">+ New territory</button></div>' +
            '<p class="bb-muted" style="font-weight:700;margin-top:0">Players travel through territories in this order. A territory unlocks when every level in the one before it is cleared.</p>';
          S.data.territories.forEach(function (t, i) {
            html += '<form class="bb-card" data-key="' + esc(t.key) + '"><div class="a-row"><div class="a-f" style="flex:0 0 70px"><label>Emoji</label><input name="emoji" value="' + esc(t.emoji) + '" maxlength="8"></div>' +
              '<div class="a-f" style="flex:3"><label>Name</label><input name="name" value="' + esc(t.name) + '" maxlength="40"></div>' +
              '<div class="a-f"><label>Look</label><select name="theme">' + CAT.themes.map(function (x) { return '<option value="' + x.key + '"' + (x.key === t.theme ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div>' +
              '<div class="a-f"><label>Main pest</label><select name="pest">' + CAT.pests.map(function (x) { return '<option value="' + x.key + '"' + (x.key === t.pest ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '</select></div></div>' +
              '<div class="a-f"><label>Blurb (on the map)</label><input name="blurb" value="' + esc(t.blurb) + '" maxlength="200"></div>' +
              '<div class="a-f"><label>Grandma\'s postcard (players read it after finding the 💌 hidden in one of these levels)</label><textarea name="postcard" maxlength="1200">' + esc(t.postcard || '') + '</textarea></div>' +
              '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="a-chk" style="margin:0 auto 0 0"><input type="checkbox" name="published"' + (t.published ? ' checked' : '') + '> Published · ' + t.levels.length + ' level' + (t.levels.length === 1 ? '' : 's') + '</label>' +
              '<button type="button" class="bb-btn small cream" data-mv="-1" ' + (i ? '' : 'disabled') + '>▲</button><button type="button" class="bb-btn small cream" data-mv="1" ' + (i < S.data.territories.length - 1 ? '' : 'disabled') + '>▼</button>' +
              '<button type="button" class="bb-btn small cream" data-del="1" ' + (t.levels.length ? 'disabled title="Move or delete its levels first"' : '') + '>🗑 Delete</button><button class="bb-btn small" type="submit">💾 Save</button></div></form>';
          });
          html += '</div>';
          body.innerHTML = html;
          body.querySelectorAll('form[data-key]').forEach(function (f) {
            f.addEventListener('submit', function (e) {
              e.preventDefault();
              var v = { key: f.dataset.key }; ['emoji', 'name', 'theme', 'pest', 'blurb', 'postcard'].forEach(function (k) { v[k] = f.elements[k].value; }); v.published = f.elements.published.checked;
              call('save_territory', [v]).then(function (d) { setData(d); BB.toast('💾 Saved', 'gold'); renderApp(); });
            });
          });
          body.onclick = function (e) {
            var a = e.target.closest('[data-a],[data-mv],[data-del]'); if (!a || a.disabled) return;
            var key = (a.closest('form') || {}).dataset ? a.closest('form') && a.closest('form').dataset.key : null;
            if (a.dataset.mv) call('move_territory', [key, +a.dataset.mv]).then(function (d) { setData(d); renderApp(); });
            else if (a.dataset.del) { if (window.confirm('Delete this territory?')) call('delete_territory', [key]).then(function (d) { setData(d); renderApp(); }); }
            else if (a.dataset.a === 'add') call('save_territory', [{ name: 'New territory', emoji: '🍜', theme: 'market', pest: 'rat', blurb: 'A brand new place to explore.', published: false }]).then(function (d) { setData(d); renderApp(); BB.toast('Added at the end, hidden until you publish it.'); });
            else if (a.dataset.a === 'restore') call('restore_defaults').then(function (d) { setData(d); BB.toast(esc(d.note || 'Done')); renderApp(); });
          };
        }

        // ------------------------------------------------------------ players tab
        function renderPlayers(body) {
          body.innerHTML = '<div class="a-page"><h2 style="margin-bottom:12px">Players</h2><div class="list">Loading…</div></div>';
          call('list_players').then(function (r) {
            if (!r || !r.ok) return;
            var box = body.querySelector('.list');
            box.innerHTML = '<div style="overflow:auto"><table class="a-table"><tr><th>Name</th><th>Email</th><th>⭐</th><th>Levels</th><th>Recipes</th><th>Found</th><th>🪙</th><th>Last played</th><th>Admin</th></tr>' +
              r.players.map(function (p) {
                return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.email) + '</td><td>' + p.stars + '</td><td>' + p.cleared + '</td><td>' + p.recipes + '</td><td>' + p.found + '</td><td>' + p.coins + '</td><td>' + esc((p.last_played || '').slice(0, 10)) + '</td>' +
                  '<td><input type="checkbox" data-email="' + esc(p.email) + '"' + (p.is_admin ? ' checked' : '') + '></td></tr>';
              }).join('') + '</table></div>' + (r.players.length ? '' : '<p>No players yet.</p>');
            box.onchange = function (e) {
              var c = e.target.closest('[data-email]'); if (!c) return;
              call('set_admin', [c.dataset.email, c.checked]).then(function (x) { if (x && x.ok) BB.toast('Updated.'); else { BB.toast(esc((x && x.error) || 'Could not update'), 'err'); c.checked = !c.checked; } });
            };
          });
        }

        start();
        window.BB_ADMIN_DEBUG = { S: S, ed: function () { return ed; }, render: render, check: check };
        return {};
      });
    })();
    </script>
package_name: BusyBun
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: false, enable_automatically: true, use_email: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: Main, type: form}
