        // ---------- title
        function renderTitle() {
          clearScreen(); show('title');
          BB.Sound.startMusic('menu');
          var guestSave = BB.store.get(GUEST_KEY, null);
          var gs = guestSave ? Object.keys(guestSave.levels || {}).length : 0;
          var el = document.createElement('div');
          el.className = 'g-screen g-title';
          el.innerHTML = '<canvas class="g-bg"></canvas>' +
            '<div class="g-hero"></div>' +
            '<div class="g-logo">Busy <span>Bun</span></div>' +
            '<div class="g-tag">A little bao on a big culinary journey</div>' +
            '<div class="g-actions">' +
            (st.signedIn ? '<button class="bb-btn big red" data-a="play">▶ Play</button><button class="bb-btn small cream" data-a="signout">Sign out</button>'
              : '<button class="bb-btn big red" data-a="guest">▶ ' + (gs ? 'Continue as guest' : 'Play now') + '</button>' +
                '<button class="bb-btn green" data-a="auth">Sign in / Create account</button>' +
                '<div class="bb-muted" style="font-weight:700;font-size:13px">An account saves your progress and puts you on the leaderboards.</div>') +
            '</div><div class="g-foot"><a data-a="howto">How to play</a> · <a data-a="admin">Level builder</a></div>';
          root.appendChild(el);
          el.querySelector('.g-hero').appendChild(hatPortrait(190, (st.progress && st.progress.hat) || BB.store.get('bb.lastHat', 'none')));
          titleBg(el.querySelector('.g-bg'));
          el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]'); if (!a) return;
            BB.Sound.play('click');
            var act2 = a.dataset.a;
            if (act2 === 'play') startSignedIn();
            else if (act2 === 'guest') startGuest();
            else if (act2 === 'auth') authModal('login');
            else if (act2 === 'signout') emit('logout').then(function () { st.signedIn = false; renderTitle(); });
            else if (act2 === 'howto') howTo();
            else if (act2 === 'admin') emit('admin');
          });
        }
        function titleBg(cv) {
          var ctx = cv.getContext('2d'), fl = [], t0 = performance.now();
          var em2 = ['🥓', '🍗', '🌿', '🥚', '🦐', '🍄', '🌶️', '🍯', '🥬', '🧄', '🦀', '🍖', '🌽'];
          for (var i = 0; i < 26; i++) fl.push({ x: Math.random(), y: Math.random(), s: 18 + Math.random() * 26, v: 0.02 + Math.random() * 0.04, e: em2[i % em2.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.6 });
          function frame(now) {
            titleAnim = requestAnimationFrame(frame);
            var dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
            if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
            var t = (now - t0) / 1000;
            fl.forEach(function (f) {
              f.y += f.v / 60; if (f.y > 1.1) { f.y = -0.1; f.x = Math.random(); }
              ctx.save(); ctx.globalAlpha = 0.55; ctx.translate(f.x * w, f.y * h); ctx.rotate(f.r + t * f.vr);
              Art.drawEmoji(ctx, f.e, 0, 0, f.s); ctx.restore();
            });
