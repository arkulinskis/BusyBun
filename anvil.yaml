            else if (k === 'auth') { BB.Sound.play('click'); authModal('signup'); }
          });
        }

        // ---------- journey
        function renderJourney(panel) {
          var s = st.status, nxt = nextLevel();
          var html = '<div class="g-h"><div><h2>The Journey</h2><p>Free each territory from the pests. Every level you clear brings Grandma\'s Banquet Book closer.</p></div></div>';
          if (st.guest) html += '<div class="g-guestbar">' + em('💾') + ' <span style="flex:1">You\'re playing as a guest. Progress is kept in this browser only.</span><button class="bb-btn small green" data-a="auth">Create free account</button></div><div style="height:14px"></div>';
          var prevCleared = true;
          st.journey.forEach(function (t, ti) {
            var cleared = s.cleared.indexOf(t.key) >= 0;
            var anyUnlocked = t.levels.some(function (l) { return isUnlocked(l.key); });
            var locked = !anyUnlocked && t.levels.length > 0;
            var stars = t.levels.reduce(function (a, l) { return a + starsOf(l.key); }, 0);
            var flag = cleared ? '<span class="g-flag free">🏮 Liberated</span>' : locked ? '<span class="g-flag lock">🔒 Locked</span>' : '<span class="g-flag pest">' + ({ ant: '🐜', rat: '🐀', fly: '🪰', roach: '🪳', gull: '🐦', king: '👑' }[t.pest] || '🐀') + ' Pests in control</span>';
            html += '<section class="g-terr th-' + esc(t.theme) + (locked ? ' locked' : '') + '" data-terr="' + esc(t.key) + '"><div class="wm bb-emoji">' + esc(t.emoji) + '</div>' +
              '<div class="g-terr-head"><div class="em bb-emoji">' + esc(t.emoji) + '</div><div class="tx"><h3>' + esc(t.name) + '</h3><p>' + esc(t.blurb) + '</p></div>' +
              '<div class="meta">' + flag + '<span class="g-flag">⭐ ' + stars + '/' + (t.levels.length * 3) + '</span>' +
              (t.postcard ? '<button class="bb-btn small cream" data-post="' + esc(t.key) + '">💌 Postcard</button>' : '') + '</div></div>' +
              roadHTML(t, nxt) +
              (locked ? '<div class="fog"><span class="bb-emoji">🐀</span><div>Free the ' + esc((st.journey[ti - 1] || {}).name || 'previous territory') + ' to travel here</div></div>' : '') +
              '</section>';
            prevCleared = cleared;
          });
          if (s.cleared.length && s.cleared.length === st.journey.filter(function (t) { return t.levels.length; }).length) {
            html += '<div class="g-banner free" style="text-align:center;font-size:20px">🎉 Every territory is free! Hunt for 3 stars, golden chopsticks and the rarest ingredients.</div>';
          }
          panel.innerHTML = html;
          panel.querySelectorAll('.g-road').forEach(function (r) { layoutRoad(r); });
          panel.querySelectorAll('.g-node .me').forEach(function (m) { m.appendChild(hatPortrait(56, st.progress.hat)); });
          panel.addEventListener('click', function (e) {
            var n = e.target.closest('[data-level]');
            if (n) { BB.Sound.play('click'); if (n.classList.contains('locked')) { BB.toast('🔒 Finish the level before this one first.'); return; } levelModal(n.dataset.level); return; }
            var pc = e.target.closest('[data-post]');
            if (pc) { BB.Sound.play('click'); postcardModal(pc.dataset.post); }
          });
          var cur = panel.querySelector('.g-node.next');
          if (cur) setTimeout(function () { cur.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 120);
        }
        function roadHTML(t, nxt) {
          var nodes = t.levels.map(function (l, i) {
            var rec = levelRec(l.key), n = starsOf(l.key), unl = isUnlocked(l.key), info = levelInfo(l.data);
            var cls = !unl ? 'locked' : n === 3 ? 'perfect' : rec.stars[0] ? 'done' : '';
            if (l.key === nxt) cls += ' next';
            return '<div class="g-node ' + cls + '" data-level="' + esc(l.key) + '" data-i="' + i + '">' +
              (l.key === nxt ? '<div class="me"></div>' : '') +
              '<button aria-label="' + esc(l.name) + '">' + (unl ? (i + 1) : '🔒') + (info.chop && rec.chop ? '' : '') + '</button>' +
              (info.chop && rec.chop ? '<span class="chop bb-emoji">🥢</span>' : '') +
              '<div class="nm">' + esc(l.name) + '</div>' +
              '<div class="st">' + [0, 1, 2].map(function (k) { return rec.stars[k] ? '<i>★</i>' : '☆'; }).join('') + '</div></div>';
          }).join('');
          return '<div class="g-road" data-n="' + t.levels.length + '"><svg preserveAspectRatio="none"></svg>' + nodes + '</div>';
        }
        function layoutRoad(r) {
          var n = +r.dataset.n, w = r.clientWidth || 600, per = w < 520 ? 3 : 5, rows = Math.ceil(n / per), rowH = 136;
          r.style.height = (rows * rowH + 40) + 'px';
          var pts = [];
          r.querySelectorAll('.g-node').forEach(function (nd, i) {
            var row = Math.floor(i / per), j = i % per, cnt = Math.min(per, n - row * per);
            var span = cnt > 1 ? (cnt - 1) : 1, xs = cnt > 1 ? 12 + j * (76 / span) : 50;
            if (row % 2) xs = 100 - xs;
            var y = row * rowH + 70 + (j % 2 ? 24 : 0);
            nd.style.left = xs + '%'; nd.style.top = y + 'px';
            pts.push([xs / 100 * w, y]);
          });
          var svg = r.querySelector('svg');
          svg.setAttribute('viewBox', '0 0 ' + w + ' ' + (rows * rowH + 40));
          var d = pts.map(function (p, i) {
