        }

        // ---------- auth
        function authModal(mode) {
          var m = BB.modal('<div class="g-auth"></div>');
          var box = m.el.querySelector('.g-auth');
          function draw(mode2, msg) {
            var signup = mode2 === 'signup', reset = mode2 === 'reset';
            box.innerHTML = '<div style="text-align:center;margin:-6px 0 6px"></div>' +
