    \  '<td><input type=\"checkbox\" data-email=\"' + esc(p.email) + '\"' + (p.is_admin ? ' checked' : '') + '></td></tr>';\n\
    \          }).join('') + '</table></div>' + (r.players.length ? '' : '<p>No players yet.</p>');\n        box.onchange\
    \ = function (e) {\n          var c = e.target.closest('[data-email]'); if (!c) return;\n          call('set_admin', [c.dataset.email,\
    \ c.checked]).then(function (x) { if (x && x.ok) BB.toast('Updated.'); else { BB.toast(esc((x && x.error) || 'Could not\
    \ update'), 'err'); c.checked = !c.checked; } });\n        };\n      });\n    }\n\n    // ------------------------------------------------------------\
    \ feedback tab (messages players sent from the game)\n    function renderFeedback(body) {\n      var filter = S.fbFilter\
    \ || 'new';\n      body.innerHTML = '<div class=\"a-page\"><div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap\"\
    ><h2 style=\"margin-right:auto\">Feedback & bug reports</h2></div><div class=\"a-filter\"></div><div class=\"list\">Loading…</div></div>';\n\
    \      function draw(r) {\n        if (!r || !r.ok) return;\n        S.data.stats.feedback_new = r.counts.new;\n     \
    \   var tabBtn = root.querySelector('[data-tab=feedback]');\n        if (tabBtn) tabBtn.innerHTML = '\U0001F4AC Feedback'\
    \ + (r.counts.new ? ' <span class=\"a-badge\">' + r.counts.new + '</span>' : '');\n        body.querySelector('.a-filter').innerHTML\
    \ = [['new', 'New'], ['read', 'Read'], ['done', 'Done'], ['', 'All']].map(function (f) {\n          var n = f[0] ? r.counts[f[0]]\
    \ : r.counts.new + r.counts.read + r.counts.done;\n          return '<button class=\"bb-btn small ' + (filter === f[0]\
    \ ? 'on' : 'cream') + '\" data-f=\"' + f[0] + '\">' + f[1] + ' (' + n + ')</button>';\n        }).join('');\n        var\
    \ list = body.querySelector('.list');\n        list.innerHTML = r.items.length ? r.items.map(function (it) {\n       \
    \   var ctx = Object.keys(it.context || {}).map(function (k) { return '<div><b>' + esc(k) + ':</b> ' + esc(it.context[k])\
    \ + '</div>'; }).join('');\n          return '<div class=\"a-fb ' + it.status + '\" data-id=\"' + esc(it.id) + '\"><div\
    \ class=\"hd\"><span class=\"kind ' + esc(it.kind) + '\">' + esc(it.kind_name) + '</span>' +\n            '<span>' + esc(it.name\
    \ || 'Guest') + (it.email ? ' · <a href=\"mailto:' + esc(it.email) + '\">' + esc(it.email) + '</a>' : '') + '</span>'\
    \ +\n            '<span style=\"margin-left:auto\">' + esc((it.created || '').replace('T', ' ').slice(0, 16)) + ' UTC\
    \ · ' + esc(it.status) + '</span></div>' +\n            '<div class=\"msg\">' + esc(it.message) + '</div>' + (ctx ? '<details><summary>Game\
    \ details</summary>' + ctx + '</details>' : '') +\n            '<div class=\"acts\">' + (it.status !== 'read' ? '<button\
    \ class=\"bb-btn small cream\" data-st=\"read\">Mark read</button>' : '') +\n            (it.status !== 'done' ? '<button\
    \ class=\"bb-btn small green\" data-st=\"done\">✓ Done</button>' : '<button class=\"bb-btn small cream\" data-st=\"new\"\
    >Reopen</button>') +\n            '<button class=\"bb-btn small cream\" data-del=\"1\">\U0001F5D1</button></div></div>';\n\
    \        }).join('') : '<p class=\"bb-muted\" style=\"font-weight:700\">' + (filter === 'new' ? 'No new messages. \U0001F389\
    ' : 'Nothing here.') + '</p>';\n      }\n      body.onclick = function (e) {\n        var f = e.target.closest('[data-f]');\n\
    \        if (f) { filter = S.fbFilter = f.dataset.f; call('list_feedback', [filter || null]).then(draw); return; }\n \
    \       var b = e.target.closest('[data-st],[data-del]'); if (!b) return;\n        var id = b.closest('[data-id]').dataset.id;\n\
    \        if (b.dataset.del) { if (window.confirm('Delete this message?')) call('delete_feedback', [id, filter || null]).then(draw);\
    \ }\n        else call('set_feedback_status', [id, b.dataset.st, filter || null]).then(draw);\n      };\n      call('list_feedback',\
    \ [filter || null]).then(draw);\n    }\n\n    start();\n    window.BB_ADMIN_DEBUG = { S: S, ed: function () { return ed;\
    \ }, render: render, check: check };\n    return {};\n  });\n})();\n</script>\n"
package_name: BusyBun
runtime_options:
  client_version: '3'
