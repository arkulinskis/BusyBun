        // ------------------------------------------------------------ helpers
        function item(k) { return ITEMS[k] || { key: k, emoji: '❔', name: k, rarity: 'common', cat: 'pantry' }; }
        function em(e, cls) { return '<span class="bb-emoji ' + (cls || '') + '">' + e + '</span>'; }
        function levelRec(key) { return (st.progress.levels || {})[key] || { stars: [false, false, false], best: null, chop: false }; }
        function starsOf(key) { return levelRec(key).stars.filter(Boolean).length; }
        function isUnlocked(key) { return st.status.unlocked.indexOf(key) >= 0; }
        function allLevels() { var out = []; st.journey.forEach(function (t) { t.levels.forEach(function (l) { out.push({ t: t, l: l }); }); }); return out; }
        function findLevel(key) { return allLevels().filter(function (x) { return x.l.key === key; })[0]; }
        function nextLevel() {
          var list = allLevels();
          for (var i = 0; i < list.length; i++) if (isUnlocked(list[i].l.key) && !levelRec(list[i].l.key).stars[0]) return list[i].l.key;
          return null;
        }
        function levelInfo(data) {
          var items = {}, npcs = [], nests = 0, kings = 0, chop = false, post = false;
          (data.ents || []).forEach(function (e) {
            if (e.t === 'item') items[e.k] = (items[e.k] || 0) + 1;
            else if (e.t === 'npc') npcs.push(e);
            else if (e.t === 'nest') nests++;
            else if (e.t === 'pest' && e.k === 'king') kings++;
            else if (e.t === 'pickup' && e.k === 'chopsticks') chop = true;
            else if (e.t === 'pickup' && e.k === 'postcard') post = true;
          });
          return { items: items, npcs: npcs, nests: nests, kings: kings, chop: chop, post: post };
        }
        // Where each ingredient can be found (for the pantry hints).
        function whereFound() {
          var w = {};
          st.journey.forEach(function (t) {
            t.levels.forEach(function (l) {
              (l.data.ents || []).forEach(function (e) {
                var ks = e.t === 'item' ? [e.k] : e.t === 'npc' && e.gift ? [e.gift] : [];
                ks.forEach(function (k) { (w[k] = w[k] || []); if (w[k].indexOf(t.name) < 0) w[k].push(t.name); });
              });
            });
          });
          return w;
