            '<kbd>Space / Shift</kbd><span>Steam Dash: bonk pests, smash crates, wreck nests (on phones: the 💨 button)</span>' +
            '<kbd>Esc / P</kbd><span>Pause</span></div>' +
            '<p><b>In each level:</b> collect the meat, help the neighbours with their errands, destroy the pest nests, then hop into the bamboo steamer.</p>' +
            '<p><b>Stars:</b> ⭐ finish · ⭐ collect every ingredient · ⭐ beat the par time.</p>' +
