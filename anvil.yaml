              '<p class="bb-muted" style="text-align:center;margin:0 0 14px;font-weight:700">' + (signup ? 'Save your journey, cook in the cloud, and race on the leaderboards.' : reset ? 'We\'ll email you a reset link.' : 'Sign in to pick up where you left off.') + '</p>' +
              '<form>' +
              (signup ? '<div class="bb-field"><label>Bun name</label><input class="bb-input" name="name" maxlength="24" placeholder="e.g. Captain Dumpling" autocomplete="nickname"></div>' : '') +
              '<div class="bb-field"><label>Email</label><input class="bb-input" name="email" type="email" required autocomplete="email"></div>' +
              (reset ? '' : '<div class="bb-field"><label>Password</label><input class="bb-input" name="password" type="password" required minlength="' + (signup ? 8 : 1) + '" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' + (signup ? '<small class="bb-muted">At least 8 characters.</small>' : '') + '</div>') +
              '<div class="bb-err">' + (msg ? esc(msg) : '') + '</div>' +
              '<button class="bb-btn red" style="width:100%" type="submit">' + (signup ? 'Create account' : reset ? 'Send reset link' : 'Sign in') + '</button></form>' +
              '<div style="text-align:center;margin-top:12px;font-weight:700">' +
              (signup ? 'Already have an account? <a href="#" data-m="login">Sign in</a>'
                : reset ? '<a href="#" data-m="login">Back to sign in</a>'
                  : 'New here? <a href="#" data-m="signup">Create an account</a> · <a href="#" data-m="reset">Forgot password?</a>') + '</div>';
            box.firstChild.appendChild(hatPortrait(84, 'none'));
            var f = box.querySelector('form');
            f.addEventListener('submit', function (e) {
              e.preventDefault();
              var v = {}; Array.prototype.forEach.call(f.elements, function (x) { if (x.name) v[x.name] = x.value; });
              var btn = f.querySelector('button'); btn.disabled = true;
              emit(mode2, v).then(function (r) {
                btn.disabled = false;
                if (!r) return;
                if (!r.ok) { box.querySelector('.bb-err').textContent = r.error || 'That didn\'t work.'; return; }
                if (r.message) { draw(r.mode || 'login', null); BB.toast(esc(r.message)); return; }
                m.close(); st.signedIn = true; onSignedIn(mode2 === 'signup');
              });
            });
            box.querySelectorAll('[data-m]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); draw(a.dataset.m); }); });
            var first = box.querySelector('input'); if (first) setTimeout(function () { first.focus(); }, 50);
          }
          draw(mode || 'login');
        }
        function onSignedIn(isNew) {
          var guest = BB.store.get(GUEST_KEY, null);
          st.guest = false;
          busy(true, 'Opening your pantry…');
          var p = (guest && Object.keys(guest.levels || {}).length) ? call('import_guest', [guest, BB.today()]) : call('get_state', [BB.today()]);
          p.then(function (r) {
            busy(false);
            if (!r || !r.ok) { BB.toast(esc((r && r.error) || 'Could not load your game.'), 'err'); renderTitle(); return; }
            apply(r);
            if (guest && Object.keys(guest.levels || {}).length && Object.keys(r.progress.levels).length) { BB.store.del(GUEST_KEY); BB.toast('💾 Your guest progress is now saved to your account!', 'gold'); }
            else if (isNew) BB.toast('Welcome to Busy Bun, ' + esc(r.me.name) + '!', 'gold');
            renderHub();
          });
        }
        function startSignedIn() { st.guest = false; busy(true, 'Opening your pantry…'); load().then(function (r) { busy(false); if (r && r.ok) renderHub(); }); }
        function startGuest() { st.guest = true; busy(true, 'Warming up the steamer…'); load().then(function (r) { busy(false); if (r && r.ok) renderHub(); }); }

        // ---------- hub
        var TABS = [['journey', '🗺️', 'Journey'], ['pantry', '🧺', 'Pantry'], ['kitchen', '🍳', 'Kitchen'], ['shop', '🎩', 'Shop'], ['badges', '🏅', 'Badges']];
        function canCookAny() { return st.catalog.recipes.some(function (r) { return Object.keys(r.needs).every(function (k) { return (st.progress.pantry[k] || 0) >= r.needs[k]; }); }); }
        function renderHub(tab) {
          clearScreen(); show('hub');
          if (tab) { st.tab = tab; BB.store.set('bb.tab', tab); }
          BB.Sound.startMusic('menu');
          var p = st.progress, s = st.status;
          BB.store.set('bb.lastHat', p.hat);
          var el = document.createElement('div'); el.className = 'g-screen g-hub';
          el.innerHTML = '<header class="g-top"><div class="g-av" data-a="settings" title="Settings"></div>' +
            '<div class="g-who"><b>' + esc(st.me.name) + '</b><small>' + (st.guest ? 'Guest · <a data-a="auth">save your progress</a>' : esc(st.me.email || '')) + '</small></div>' +
            '<div class="g-pills"><span class="bb-pill" title="Steam coins">' + em('🪙') + p.coins + '</span>' +
            '<span class="bb-pill" title="Stars">' + em('⭐') + s.stars + '<span class="bb-muted">/' + s.stars_max + '</span></span>' +
            '<span class="bb-pill chop" title="Golden chopsticks">' + em('🥢') + s.chopsticks + '<span class="bb-muted">/' + s.chopsticks_max + '</span></span></div>' +
            '<button class="g-iconbtn ' + (st.daily_ready ? 'glow' : '') + '" data-a="daily" title="Daily market box">📦' + (st.daily_ready ? '<span class="dot"></span>' : '') + '</button>' +
            '<button class="g-iconbtn" data-a="settings" title="Settings">⚙️</button></header>' +
            '<nav class="g-tabs">' + TABS.map(function (tb) {
