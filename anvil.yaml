              return '<button class="g-tab ' + (st.tab === tb[0] ? 'on' : '') + '" data-tab="' + tb[0] + '">' + em(tb[1]) + tb[2] + (dot ? '<span class="dot"></span>' : '') + '</button>';
            }).join('') + '</nav>' +
            '<main class="g-main"><div class="g-panel"></div></main>';
          root.appendChild(el);
          el.querySelector('.g-av').appendChild(hatPortrait(52, p.hat));
          var panel = el.querySelector('.g-panel');
          ({ journey: renderJourney, pantry: renderPantry, kitchen: renderKitchen, shop: renderShop, badges: renderBadges }[st.tab] || renderJourney)(panel);
          el.addEventListener('click', function (e) {
            var tb = e.target.closest('[data-tab]');
            if (tb) { BB.Sound.play('click'); renderHub(tb.dataset.tab); return; }
            var a = e.target.closest('[data-a]'); if (!a) return;
            var k = a.dataset.a;
            if (k === 'settings') { BB.Sound.play('click'); settings(); }
