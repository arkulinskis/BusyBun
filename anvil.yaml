            return 'C' + mx + ' ' + q[1] + ' ' + mx + ' ' + p[1] + ' ' + p[0] + ' ' + p[1];
          }).join(' ');
          svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#3d2416" stroke-width="12" stroke-linecap="round"/>' +
