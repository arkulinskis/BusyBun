    \ scale(1.02, .98); }\n  }\n  @keyframes bbHopShadow { 0%, 100% { transform: scale(1); opacity: .32; } 50% { transform:\
    \ scale(.5); opacity: .12; } }\n  #loadingSpinner { --anvil-spinner-size: 110px; width: 110px; height: 110px; border-radius:\
    \ 50%;\n    background: radial-gradient(circle closest-side, #fff7ea 92%, #3d2416 93%, #3d2416 97%, transparent 98%) !important;\
    \ box-shadow: 0 4px 0 #3d2416; }\n  #loadingSpinner > svg, #loadingSpinner > img { display: none !important; }\n  #loadingSpinner::before,\
