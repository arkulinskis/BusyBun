    \ background: #ffd9d4; }\n  .bb-toast.gold { background: var(--bb-gold); }\n  @keyframes bbFade { from { opacity: 0; }\
    \ }\n  @keyframes bbPop { from { transform: scale(.85); opacity: 0; } }\n  @keyframes bbDrop { from { transform: translateY(-20px);\
