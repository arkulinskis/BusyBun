          return '<div class="g-goals">' + out.map(function (o) { return '<div class="g-goal">' + em(o[0]) + '<span>' + o[1] + '</span></div>'; }).join('') + '</div>';
        }
        function levelModal(key) {
          var f = findLevel(key); if (!f) return;
          var l = f.l, t = f.t, rec = levelRec(key), info = levelInfo(l.data), seen = st.progress.seen;
          var chips = Object.keys(info.items).sort(function (a, b) { return RARITY_ORDER[item(a).rarity] - RARITY_ORDER[item(b).rarity]; }).map(function (k) {
            var it = item(k), known = seen[k];
            return '<span class="g-chip ' + (known ? '' : 'unknown') + '" title="' + esc(known ? it.name : 'Not discovered yet') + '">' + em(it.emoji) + (known ? esc(it.name) : '???') + ' ×' + info.items[k] + '</span>';
          }).join('');
          var m = BB.modal('<div class="g-lv"><div class="sub">' + esc(t.emoji + ' ' + t.name) + '</div><h2>' + esc(l.name) + '</h2>' +
            '<div class="thumb"></div>' +
            (l.data.intro ? '<p style="font-weight:700">' + esc(l.data.intro) + '</p>' : '') + goalsHTML(l.data, info) +
            '<div class="g-chips" style="margin:6px 0 10px">' + chips + '</div>' +
            '<div class="g-chips">' +
            '<span class="g-chip">⏱ Par ' + BB.fmtTime(l.data.par || 60) + '</span>' +
            '<span class="g-chip">🏆 Best ' + BB.fmtTime(rec.best) + '</span>' +
            '<span class="g-chip">' + [0, 1, 2].map(function (k) { return rec.stars[k] ? '⭐' : '☆'; }).join('') + '</span>' +
            (info.chop ? '<span class="g-chip">' + em('🥢') + (rec.chop ? 'Found!' : 'Hidden here') + '</span>' : '') +
            (info.post ? '<span class="g-chip">' + em('💌') + (t.postcard ? 'Postcard found' : 'A postcard is hidden here') + '</span>' : '') +
            '</div>' +
            '<div class="g-board"><div class="hd"><span>#</span><span>Top buns</span><span>Time</span></div><div><span></span><span class="bb-muted">Loading…</span></div></div>' +
            '<div class="g-row"><button class="bb-btn big red" data-a="go">▶ Play</button></div></div>');
          m.el.querySelector('.thumb').appendChild(Art.levelThumb(l.data, t.theme, Math.min(460, window.innerWidth - 90)));
          m.el.querySelector('[data-a="go"]').addEventListener('click', function () { BB.Sound.play('click'); m.close(); play(key); });
          call('leaderboard', [key]).then(function (b) { fillBoard(m.el.querySelector('.g-board'), b); });
        }
        function fillBoard(el, b) {
          if (!el) return;
          if (!b || !b.top || !b.top.length) { el.innerHTML = '<div class="hd"><span>#</span><span>Top buns</span><span>Time</span></div><div><span></span><span class="bb-muted">No times yet. Be the first!</span></div>'; return; }
          var rows = b.top.slice(0, 5).map(function (r) { return '<div class="' + (r.you ? 'you' : '') + '"><span>' + r.rank + '</span><span>' + esc(r.name) + '</span><span>' + BB.fmtTime(r.time) + '</span></div>'; }).join('');
          if (b.you && b.you.rank > 5) rows += '<div class="you"><span>' + b.you.rank + '</span><span>' + esc(b.you.name) + ' (you)</span><span>' + BB.fmtTime(b.you.time) + '</span></div>';
          el.innerHTML = '<div class="hd"><span>#</span><span>Top buns · ' + b.total + ' player' + (b.total === 1 ? '' : 's') + '</span><span>Time</span></div>' + rows +
            (st.guest ? '<div><span></span><span class="bb-muted">Create an account to get on the board.</span></div>' : '');
        }

        // ---------- play
        function play(key) {
          var f = findLevel(key); if (!f) return;
          curLevel = f;
          clearScreen(); show('play');
          var touch = BB.isTouch();
          var el = document.createElement('div'); el.className = 'g-screen g-play';
          el.innerHTML = '<canvas class="g-cv"></canvas><div class="g-hud">' +
            '<div class="tl"><div class="g-hearts"></div><div class="g-goalbar"></div></div>' +
            '<div class="g-timer"></div>' +
            '<div class="tr"><canvas class="g-mm"></canvas><button class="g-iconbtn" data-a="pause" title="Pause (Esc)">⏸</button></div>' +
            (touch ? '<div class="g-stick"><div class="base"></div><div class="knob"></div><div class="hint">◀ drag to move ▶</div></div>' : '') +
            '<div class="g-dash ' + (touch ? '' : 'kb') + '"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#3d8fd1" stroke-width="6" stroke-dasharray="295" stroke-dashoffset="0"/></svg>' + em('💨') + (touch ? 'DASH' : 'SPACE') + '</div>' +
            '</div>';
          root.appendChild(el);
          var cv = el.querySelector('.g-cv'), hud = {
            hearts: el.querySelector('.g-hearts'), goals: el.querySelector('.g-goalbar'), timer: el.querySelector('.g-timer'),
            dash: el.querySelector('.g-dash'), ring: el.querySelector('.g-dash circle')
          };
          BB.Sound.startMusic(moodFor(f.t.theme));
          game = BB.Game(cv, {
            level: f.l.data, theme: f.t.theme, items: ITEMS, perks: st.status.perks, hat: st.progress.hat, minimap: el.querySelector('.g-mm'),
            onHud: function (h) { drawHud(hud, h); },
            onEvent: function (name, d) { onGameEvent(name, d, el); }
          });
          // touch controls
          if (touch) {
            var area = el.querySelector('.g-stick'), base = area.querySelector('.base'), knob = area.querySelector('.knob'), hint = area.querySelector('.hint'), id = null, ox = 0, oy = 0;
            area.addEventListener('touchstart', function (e) {
              var tch = e.changedTouches[0]; id = tch.identifier; var r = area.getBoundingClientRect();
              ox = tch.clientX - r.left; oy = tch.clientY - r.top;
              base.style.display = knob.style.display = 'block'; hint.style.display = 'none';
              base.style.left = knob.style.left = ox + 'px'; base.style.top = knob.style.top = oy + 'px'; e.preventDefault();
            }, { passive: false });
            area.addEventListener('touchmove', function (e) {
              for (var i = 0; i < e.changedTouches.length; i++) {
                var tch = e.changedTouches[i]; if (tch.identifier !== id) continue;
                var r = area.getBoundingClientRect(), dx = tch.clientX - r.left - ox, dy = tch.clientY - r.top - oy, d = Math.sqrt(dx * dx + dy * dy), max = 52;
                if (d > max) { dx = dx / d * max; dy = dy / d * max; }
                knob.style.left = (ox + dx) + 'px'; knob.style.top = (oy + dy) + 'px';
                if (game) game.setStick(dx / max, dy / max);
              }
              e.preventDefault();
            }, { passive: false });
            var end = function (e) {
              for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === id) {
                id = null; base.style.display = knob.style.display = 'none'; if (game) game.setStick(0, 0);
              }
            };
            area.addEventListener('touchend', end); area.addEventListener('touchcancel', end);
            hud.dash.addEventListener('touchstart', function (e) { e.preventDefault(); if (game) game.dash(); }, { passive: false });
          } else {
            hud.dash.addEventListener('mousedown', function () { if (game) game.dash(); });
          }
          el.querySelector('[data-a="pause"]').addEventListener('click', function () { pauseMenu(); });
          introCard(f);
        }
        function drawHud(hud, h) {
          var hs = '';
          for (var i = 0; i < h.maxHearts; i++) hs += '<span class="' + (i < h.hearts ? '' : 'off') + '">♥</span>';
          if (h.shield) hs += '<span class="sh">◆</span>';
          hud.hearts.innerHTML = hs;
          var g = h.goals, chips = [];
          if (g.meatGoal) chips.push([g.meat >= g.meatGoal, '🥩', Math.min(g.meat, g.meatGoal) + '/' + g.meatGoal]);
          if (g.errandsGoal && g.errandsTotal) chips.push([g.errandsDone >= g.errandsTotal, '🤝', g.errandsDone + '/' + g.errandsTotal]);
          if (g.nestsGoal && g.nestsTotal) chips.push([!g.nestsLeft, '💥', (g.nestsTotal - g.nestsLeft) + '/' + g.nestsTotal]);
          if (g.kingsTotal) chips.push([!g.kingsLeft, '👑', g.kingsLeft ? 'Beat him!' : 'Done']);
          chips.push([h.found >= h.totalItems, '🧺', h.found + '/' + h.totalItems]);
          if (g.ok) chips.push([true, '♨️', 'Steamer open!']);
          hud.goals.innerHTML = chips.map(function (c) { return '<span class="g-gchip ' + (c[0] ? 'ok' : '') + '">' + em(c[1]) + c[2] + '</span>'; }).join('') +
            (h.coins ? '<span class="g-gchip">' + em('🪙') + h.coins + '</span>' : '') + (h.chopsticks ? '<span class="g-gchip ok">' + em('🥢') + '</span>' : '') + (h.postcard ? '<span class="g-gchip ok">' + em('💌') + '</span>' : '');
          hud.timer.className = 'g-timer' + (h.time > h.par ? ' over' : '');
          hud.timer.innerHTML = '⏱ ' + BB.fmtTime(h.time) + ' <small>/ par ' + BB.fmtTime(h.par) + '</small>';
          hud.ring.setAttribute('stroke-dashoffset', String(295 * (1 - h.dash)));
          hud.dash.classList.toggle('ready', h.dash >= 1);
        }
        function introCard(f) {
          var info = levelInfo(f.l.data), touch = BB.isTouch();
          var m = BB.modal('<div class="g-lv"><div class="sub">' + esc(f.t.emoji + ' ' + f.t.name) + '</div><h2>' + esc(f.l.name) + '</h2>' +
            (f.l.data.intro ? '<p style="font-weight:700">' + esc(f.l.data.intro) + '</p>' : '') + goalsHTML(f.l.data, info) +
            '<div class="g-ctrls">' + (touch ? '<kbd>Left side</kbd><span>Drag to move</span><kbd>💨</kbd><span>Steam Dash</span>' : '<kbd>WASD / arrows</kbd><span>Move</span><kbd>Space</kbd><span>Steam Dash (bonk, smash, wreck nests)</span>') + '</div>' +
            (st.status.perks.length ? '<div class="g-chips">' + st.status.perks.map(function (p) { var r = st.catalog.recipes.filter(function (x) { return x.perk === p; })[0]; return r ? '<span class="g-chip">' + em(r.emoji) + esc(r.perk_name) + '</span>' : ''; }).join('') + '</div>' : '') +
            '<div class="g-row"><button class="bb-btn big red" data-a="go">Let\'s roll! 🥟</button><button class="bb-btn cream" data-a="map">Back to map</button></div></div>',
            { noClose: true });
          m.el.querySelector('[data-a="go"]').addEventListener('click', function () { BB.Sound.play('click'); m.close(); if (game) game.start(); });
          m.el.querySelector('[data-a="map"]').addEventListener('click', function () { BB.Sound.play('click'); m.close(); renderHub('journey'); });
        }
        var pauseOpen = null;
        function pauseMenu() {
          if (!game || pauseOpen) return;
          game.pause();
          pauseOpen = BB.modal('<div style="text-align:center"><h2>Paused</h2><p class="bb-muted" style="font-weight:700">' + esc(curLevel.l.name) + '</p>' +
            '<div style="display:flex;flex-direction:column;gap:10px;max-width:260px;margin:14px auto 0">' +
            '<button class="bb-btn red" data-a="resume">▶ Resume</button><button class="bb-btn" data-a="restart">↻ Restart level</button>' +
            '<button class="bb-btn cream" data-a="sfx">' + (BB.Sound.sfxOn ? '🔊 Sounds on' : '🔇 Sounds off') + '</button>' +
            '<button class="bb-btn cream" data-a="music">' + (BB.Sound.musicOn ? '🎵 Music on' : '🎵 Music off') + '</button>' +
            '<button class="bb-btn cream" data-a="quit">🗺️ Quit to map</button></div></div>', { onClose: function () { pauseOpen = null; if (game) game.resume(); } });
          pauseOpen.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]'); if (!a) return; BB.Sound.play('click');
            var k = a.dataset.a, pm = pauseOpen;
            if (k === 'resume') pm.close();
            else if (k === 'restart') { pauseOpen = null; pm.close(); play(curLevel.l.key); }
            else if (k === 'quit') { pauseOpen = null; pm.close(); renderHub('journey'); }
            else if (k === 'sfx') { BB.Sound.setSfx(!BB.Sound.sfxOn); a.textContent = BB.Sound.sfxOn ? '🔊 Sounds on' : '🔇 Sounds off'; }
            else if (k === 'music') { BB.Sound.setMusic(!BB.Sound.musicOn); a.textContent = BB.Sound.musicOn ? '🎵 Music on' : '🎵 Music off'; if (BB.Sound.musicOn) BB.Sound.startMusic(moodFor(curLevel.t.theme)); }
          });
        }
        document.addEventListener('visibilitychange', function () { if (document.hidden && st.screen === 'play' && game && !game.isPaused()) pauseMenu(); });

        function onGameEvent(name, d, el) {
          if (name === 'pause') pauseMenu();
          else if (name === 'toast') BB.toast(esc(d.text));
          else if (name === 'talk') showTalk(d, el);
          else if (name === 'win') submitWin(d);
          else if (name === 'lose') loseCard();
        }
        function showTalk(d, el) {
          var old = el.querySelector('.g-talk'); if (old) old.remove();
          var box = document.createElement('div'); box.className = 'g-talk' + (BB.isTouch() ? ' touch' : '');
          var c = Art.canvas(58, 58); Art.drawNPC(c.ctx, d.npc.style, 29, 28, 20, { happy: d.done });
          box.appendChild(c.el);
          var tx = document.createElement('div');
          tx.innerHTML = '<b>' + esc(d.npc.name) + '</b><p>' + esc(d.text) + '</p>' +
            (d.done ? (d.gift ? '<span class="need">Gift: ' + em(d.gift.item.emoji) + ' ' + esc(d.gift.item.name) + ' ×' + d.gift.count + '</span>' : '')
              : '<span class="need">' + em(d.item.emoji) + ' ' + esc(d.item.name) + ' ' + Math.min(d.have, d.need) + '/' + d.need + '</span>');
          box.appendChild(tx);
          el.querySelector('.g-hud').appendChild(box);
          clearTimeout(talkTimer);
          talkTimer = setTimeout(function () { box.remove(); }, d.justDone ? 4200 : 3600);
        }
        function loseCard() {
          var m = BB.modal('<div style="text-align:center"><div class="pv" style="width:120px;margin:0 auto"></div><h2>Squished!</h2><p style="font-weight:700">The pests got the better of you this time. Every bun gets back up.</p>' +
            '<div class="g-row"><button class="bb-btn red" data-a="retry">↻ Try again</button><button class="bb-btn cream" data-a="map">🗺️ Map</button></div></div>', { noClose: true });
          m.el.querySelector('.pv').appendChild(hatPortrait(120, st.progress.hat, { face: 'ouch', sy: 0.7, sx: 1.25 }));
          m.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]'); if (!a) return; BB.Sound.play('click'); m.close();
            if (a.dataset.a === 'retry') play(curLevel.l.key); else renderHub('journey');
          });
        }
        function submitWin(d) {
          var key = curLevel.l.key, prevSeen = Object.assign({}, st.progress.seen);
          act('finish_level', [key, d.result], 'Steaming your bun…').then(function (r) {
            if (!r || !r.ok) { loseCardError(r); return; }
            results(r.report, d, prevSeen);
          });
        }
        function loseCardError(r) {
          var m = BB.modal('<div style="text-align:center"><h2>Hmm…</h2><p style="font-weight:700">' + esc((r && r.error) || 'Your result could not be saved.') + '</p><div class="g-row"><button class="bb-btn red" data-a="retry">↻ Play again</button><button class="bb-btn cream" data-a="map">Map</button></div></div>', { noClose: true });
          m.el.addEventListener('click', function (e) { var a = e.target.closest('[data-a]'); if (!a) return; m.close(); if (a.dataset.a === 'retry') play(curLevel.l.key); else renderHub('journey'); });
        }
        function results(rep, d, prevSeen) {
          var f = curLevel, par = f.l.data.par || 60;
          var labels = ['Finished!', 'All ingredients (' + d.found + '/' + d.totalItems + ')', 'Under par (' + BB.fmtTime(par) + ')'];
          var rec = levelRec(f.l.key);
          var stars = [0, 1, 2].map(function (i) { return '<div class="g-star" data-i="' + i + '"><div class="s">★</div><small>' + esc(labels[i]) + '</small></div>'; }).join('');
          var gained = Object.keys(rep.gained || {}).map(function (k) {
            var it = item(k), isNew = rep.new_items.indexOf(k) >= 0;
            return '<span class="g-chip">' + (isNew ? '<span class="g-new">NEW</span>' : '') + em(it.emoji) + esc(it.name) + ' ×' + rep.gained[k] + '</span>';
          }).join('');
          var extras = '';
          if (rep.liberated) { var tt = st.journey.filter(function (x) { return x.key === rep.liberated; })[0]; extras += '<div class="g-banner free">🏮 ' + esc(tt ? tt.name : 'The territory') + ' is free from pests!</div>'; }
          if (rep.postcard) extras += '<div class="g-banner post" data-a="post">💌 You found Grandma\'s postcard! Tap to read.</div>';
          if (rep.chopsticks) extras += '<div class="g-banner" style="background:#fff1c9">🥢 Golden chopsticks added to your collection!</div>';
          (rep.new_badges || []).forEach(function (b) { var bb = st.catalog.badges.filter(function (x) { return x.key === b; })[0]; if (bb) extras += '<div class="g-banner badge">' + em(bb.emoji) + ' Badge earned: <b>' + esc(bb.name) + '</b></div>'; });
          var nxtKey = null;
          (rep.unlocked || []).forEach(function (k) { if (!nxtKey) nxtKey = k; });
          if (!nxtKey) { var list = allLevels(); for (var i = 0; i < list.length; i++) if (list[i].l.key === f.l.key && list[i + 1] && isUnlocked(list[i + 1].l.key)) nxtKey = list[i + 1].l.key; }
          var m = BB.modal('<div class="g-res"><h2>' + (rep.first_clear ? 'Order up! 🥟' : 'Delicious! 🥟') + '</h2>' +
            '<div class="g-stars">' + stars + '</div>' +
            '<div class="line"><span>⏱ ' + BB.fmtTime(rep.time) + '</span><span class="bb-muted">Best ' + BB.fmtTime(rep.best) + '</span>' + (rep.new_best && !rep.first_clear ? '<span style="color:#e0483a">NEW BEST!</span>' : '') + '</div>' +
            '<div class="coins">+' + rep.coins + ' 🪙</div>' +
            '<details><summary>Coin breakdown</summary>' + rep.coin_parts.map(function (p) { return '<div><span>' + esc(p[0]) + '</span><b>+' + p[1] + '</b></div>'; }).join('') + '</details>' +
            (gained ? '<div class="g-chips" style="justify-content:center;margin:10px 0">' + gained + '</div>' : '') + extras +
            (st.guest ? '<div class="g-guestbar" style="margin-top:12px"><span style="flex:1">💾 Save this to the cloud and race on the leaderboard.</span><button class="bb-btn small green" data-a="auth">Create account</button></div>' : '') +
            '<div class="g-board"><div><span></span><span class="bb-muted">…</span></div></div>' +
            '<div class="g-row">' + (nxtKey ? '<button class="bb-btn big red" data-a="next">Next level ▶</button>' : '') +
            '<button class="bb-btn" data-a="replay">↻ Replay</button><button class="bb-btn cream" data-a="map">🗺️ Map</button></div></div>', { noClose: true });
          fillBoard(m.el.querySelector('.g-board'), rep.leaderboard);
          // stars pop in one by one
          [0, 1, 2].forEach(function (i) {
            setTimeout(function () {
              var s = m.el.querySelector('.g-star[data-i="' + i + '"]');
              if (rep.stars[i]) { s.classList.add('on'); BB.Sound.play('star'); }
              else if (rec.stars[i]) s.classList.add('got');
            }, 350 + i * 380);
          });
          if (rep.liberated) setTimeout(function () { BB.Sound.play('clear'); }, 1600);
          m.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]'); if (!a) return; BB.Sound.play('click');
            var k = a.dataset.a;
            if (k === 'post') { postcardModal(rep.postcard.territory); return; }
            if (k === 'auth') { authModal('signup'); return; }
            m.close();
            if (k === 'next') { renderHub('journey'); levelModal(nxtKey); }
            else if (k === 'replay') play(f.l.key);
            else renderHub('journey');
          });
        }

        // ---------- pantry
        function renderPantry(panel) {
          var p = st.progress, where = whereFound(), items = st.catalog.items, seenN = items.filter(function (i) { return p.seen[i.key]; }).length;
          var html = '<div class="g-h"><div><h2>The Pantry</h2><p>Everything you\'ve ever found. Discover them all!</p></div>' +
            '<div style="min-width:220px;flex:1;max-width:340px"><b>' + seenN + ' / ' + items.length + ' discovered</b><div class="g-bar"><i style="width:' + Math.round(100 * seenN / items.length) + '%"></i></div></div></div>';
          st.catalog.categories.forEach(function (c) {
            html += '<div class="g-sec">' + em(c.emoji) + '<h3>' + esc(c.name) + '</h3><span class="bb-muted" style="font-weight:700">' + esc(c.blurb) + '</span></div><div class="g-grid">';
            items.filter(function (i) { return i.cat === c.key; }).forEach(function (i) {
              var known = p.seen[i.key], have = p.pantry[i.key] || 0, rar = st.catalog.rarity[i.rarity];
              var isNew = known && !st.seenNew[i.key];
              html += '<div class="g-it r-' + i.rarity + (known ? '' : ' unknown') + '" data-item="' + i.key + '">' + (isNew ? '<span class="g-new">NEW</span>' : '') +
                (known ? '<span class="cnt">×' + have + '</span>' : '') + em(i.emoji) +
                '<b>' + (known ? esc(i.name) : '???') + '</b>' +
                '<span class="g-rar" style="background:' + rar.color + '">' + esc(rar.name) + '</span>' +
                (known ? '' : '<small>' + esc(where[i.key] ? where[i.key][0] : (i.rarity === 'legendary' ? 'A legend…' : 'The market box')) + '</small>') + '</div>';
            });
            html += '</div>';
          });
          // treasures
          var s = st.status, hats = p.hats.filter(function (h) { return h !== 'none'; }).length;
          html += '<div class="g-sec">' + em('💎') + '<h3>Treasures</h3></div><div class="g-grid">' +
            '<div class="g-it" style="cursor:default">' + em('🥢') + '<b>Golden Chopsticks</b><small>' + s.chopsticks + ' / ' + s.chopsticks_max + ' found</small></div>' +
            '<div class="g-it" style="cursor:default">' + em('🥟') + '<b>Recipes</b><small>' + Object.keys(p.cooked).length + ' / ' + st.catalog.recipes.length + ' cooked</small></div>' +
            '<div class="g-it" style="cursor:default">' + em('🎩') + '<b>Hats</b><small>' + hats + ' / ' + (st.catalog.hats.length - 1) + ' owned</small></div>' +
            '<div class="g-it" style="cursor:default">' + em('🏮') + '<b>Territories</b><small>' + s.cleared.length + ' / ' + st.journey.length + ' liberated</small></div></div>';
          html += '<div class="g-sec">' + em('💌') + '<h3>Grandma\'s postcards</h3><span class="bb-muted" style="font-weight:700">One is hidden in each territory.</span></div><div class="g-cards">' +
            st.journey.map(function (t) {
              return t.postcard ? '<div class="g-post" data-post="' + esc(t.key) + '">' + em('💌') + esc(t.name) + '</div>'
                : '<div class="g-post sealed">' + em('✉️') + '???</div>';
            }).join('') + '</div>';
          panel.innerHTML = html;
          panel.addEventListener('click', function (e) {
            var it = e.target.closest('[data-item]');
            if (it) { BB.Sound.play('click'); itemModal(it.dataset.item, where); st.seenNew[it.dataset.item] = 1; BB.store.set('bb.seenNew', st.seenNew); var n = it.querySelector('.g-new'); if (n) n.remove(); return; }
            var pc = e.target.closest('[data-post]');
            if (pc) { BB.Sound.play('click'); postcardModal(pc.dataset.post); }
          });
        }
        function itemModal(k, where) {
          var i = item(k), p = st.progress, known = p.seen[k], rar = st.catalog.rarity[i.rarity];
          var uses = st.catalog.recipes.filter(function (r) { return r.needs[k]; });
          BB.modal('<div style="text-align:center"><div class="bb-emoji" style="font-size:80px;' + (known ? '' : 'filter:brightness(0) opacity(.2)') + '">' + i.emoji + '</div>' +
            '<h2>' + (known ? esc(i.name) : '???') + '</h2><span class="g-rar" style="background:' + rar.color + '">' + esc(rar.name) + '</span>' +
            '<p style="font-weight:700">' + (known ? esc(i.desc) : 'You haven\'t found this yet.') + '</p>' +
            (known ? '<div class="g-chips" style="justify-content:center"><span class="g-chip">In pantry: ' + (p.pantry[k] || 0) + '</span><span class="g-chip">Found in total: ' + p.seen[k] + '</span></div>' : '') +
            '<p class="bb-muted" style="font-weight:800">Where: ' + esc((where[k] || []).join(', ') || (i.rarity === 'legendary' ? 'Somewhere legendary…' : 'The daily market box or the market stall')) + '</p>' +
            (uses.length ? '<p style="font-weight:800">Used in: ' + uses.map(function (r) { return esc(r.emoji + ' ' + r.name); }).join(', ') + '</p>' : '') + '</div>');
        }
        function postcardModal(tkey) {
          var t = st.journey.filter(function (x) { return x.key === tkey; })[0];
          if (!t || !t.postcard) return;
          BB.Sound.play('unlock');
          BB.modal('<h2 style="margin-right:40px">A postcard from ' + esc(t.name) + '</h2><div class="g-postcard" style="margin-top:12px"><div class="stamp bb-emoji">' + esc(t.emoji) + '</div>' + esc(t.postcard) + '</div>');
        }

        // ---------- kitchen
        function renderKitchen(panel) {
          var p = st.progress;
          var html = '<div class="g-h"><div><h2>Grandma\'s Kitchen</h2><p>Cook recipes from your pantry. The first time you cook one, you learn its perk forever. Cooking it again sells the bao for ' + st.catalog.recipe_sell + ' 🪙.</p></div></div><div class="g-recipes">';
          st.catalog.recipes.forEach(function (r) {
            var ok = Object.keys(r.needs).every(function (k) { return (p.pantry[k] || 0) >= r.needs[k]; }), cooked = p.cooked[r.key] || 0;
            html += '<div class="g-rec ' + (cooked ? 'cooked' : '') + '"><div class="hd">' + em(r.emoji) + '<div><h4>' + esc(r.name) + '</h4><div class="perk">' + (cooked ? '✓ ' : '🔒 ') + esc(r.perk_name) + ': ' + esc(r.perk_desc) + '</div></div></div>' +
              '<div class="needs">' + Object.keys(r.needs).map(function (k) {
                var it = item(k), have = p.pantry[k] || 0, known = p.seen[k];
                return '<span class="g-need ' + (have >= r.needs[k] ? 'ok' : '') + '" title="' + esc(known ? it.name : '???') + '">' + em(known ? it.emoji : '❔') + have + '/' + r.needs[k] + '</span>';
              }).join('') + '</div>' +
              '<div class="ft"><span class="bb-muted" style="font-weight:800">' + (cooked ? 'Cooked ×' + cooked : 'Not cooked yet') + '</span>' +
              '<button class="bb-btn small ' + (cooked ? '' : 'red') + '" data-cook="' + r.key + '" ' + (ok ? '' : 'disabled') + '>' + (cooked ? 'Cook again +' + st.catalog.recipe_sell + '🪙' : 'Cook! 🔥') + '</button></div></div>';
          });
          html += '</div>';
          panel.innerHTML = html;
          panel.addEventListener('click', function (e) {
            var b = e.target.closest('[data-cook]'); if (!b || b.disabled) return;
            BB.Sound.play('cook');
            var r = RECIPES[b.dataset.cook];
            var m = BB.modal('<div class="g-cook"><div class="pot bb-emoji">♨️</div><h2>Cooking ' + esc(r.name) + '…</h2></div>', { noClose: true });
            var t0 = Date.now();
            act('cook', [r.key], 'Steaming…').then(function (res) {
              setTimeout(function () {
                m.close();
                if (!res || !res.ok) return;
                var rep = res.report;
                var mm = BB.modal('<div class="g-cook"><div class="bb-emoji" style="font-size:90px;animation:bbPop .4s">' + r.emoji + '</div><h2>' + esc(r.name) + '!</h2>' +
                  (rep.first ? '<div class="g-banner free">✨ New perk: <b>' + esc(r.perk_name) + '</b><br><span style="font-family:var(--bb-font);font-weight:700">' + esc(r.perk_desc) + '</span></div>' : '<p style="font-weight:800">Sold to a hungry neighbour for +' + rep.coins + ' 🪙</p>') +
                  (rep.hat ? '<div class="g-banner">👑 You earned the ' + esc(HATS[rep.hat].name) + '! Wear it from the Shop.</div>' : '') +
                  (rep.new_badges || []).map(function (bk) { var bb = st.catalog.badges.filter(function (x) { return x.key === bk; })[0]; return bb ? '<div class="g-banner badge">' + em(bb.emoji) + ' Badge earned: <b>' + esc(bb.name) + '</b></div>' : ''; }).join('') +
                  '<div class="g-row"><button class="bb-btn red" data-a="ok">Yum!</button></div></div>');
                BB.Sound.play(rep.first ? 'clear' : 'coin');
                mm.el.querySelector('[data-a="ok"]').addEventListener('click', function () { mm.close(); });
                renderHub('kitchen');
              }, Math.max(0, 1100 - (Date.now() - t0)));
            });
          });
        }

        // ---------- shop
        function renderShop(panel) {
          var p = st.progress, bought = (p.market.day === st.today ? p.market.bought : []);
          var html = '<div class="g-h"><div><h2>The Shop</h2><p>Spend your steam coins on hats and fresh ingredients.</p></div><span class="bb-pill">' + em('🪙') + p.coins + '</span></div>';
          html += '<div class="g-sec">' + em('🧺') + '<h3>Market stall</h3><span class="bb-muted" style="font-weight:700">New stock every day.</span></div><div class="g-grid">';
          st.market.forEach(function (o) {
            var i = item(o.item), done = bought.indexOf(o.id) >= 0, rar = st.catalog.rarity[i.rarity];
            html += '<div class="g-it r-' + i.rarity + '" style="cursor:default"><span class="cnt">×' + o.qty + '</span>' + em(i.emoji) + '<b>' + esc(i.name) + '</b><span class="g-rar" style="background:' + rar.color + '">' + esc(rar.name) + '</span>' +
              '<div style="margin-top:8px"><button class="bb-btn small ' + (done ? 'cream' : '') + '" data-buy="' + esc(o.id) + '" ' + (done || p.coins < o.price ? 'disabled' : '') + '>' + (done ? 'Sold out' : o.price + ' 🪙') + '</button></div></div>';
          });
          html += '</div><div class="g-sec">' + em('🎩') + '<h3>Hat stand</h3></div><div class="g-grid">';
          st.catalog.hats.forEach(function (h) {
            var own = p.hats.indexOf(h.key) >= 0, wearing = p.hat === h.key;
            var btn = wearing ? '<button class="bb-btn small cream" disabled>Wearing</button>'
              : own ? '<button class="bb-btn small green" data-wear="' + h.key + '">Wear</button>'
                : h.price == null ? '<button class="bb-btn small cream" disabled>Recipe reward</button>'
                  : '<button class="bb-btn small" data-hat="' + h.key + '" ' + (p.coins < h.price ? 'disabled' : '') + '>' + h.price + ' 🪙</button>';
            html += '<div class="g-it g-hat ' + (wearing ? 'wearing' : '') + '" data-pv="' + h.key + '" style="cursor:default"><div class="pv"></div><b>' + esc(h.name) + '</b><small>' + esc(h.desc) + '</small><div style="margin-top:8px">' + btn + '</div></div>';
          });
          html += '</div>';
          panel.innerHTML = html;
          panel.querySelectorAll('[data-pv]').forEach(function (d) { d.querySelector('.pv').appendChild(hatPortrait(96, d.dataset.pv)); });
          panel.addEventListener('click', function (e) {
            var b = e.target.closest('[data-buy],[data-hat],[data-wear]'); if (!b || b.disabled) return;
            BB.Sound.play('click');
            var pr;
            if (b.dataset.buy) pr = act('buy_market', [b.dataset.buy], 'Haggling…').then(function (r) { if (r && r.ok) { BB.Sound.play('coin'); var it = item(r.report.item); BB.toast(em(it.emoji) + ' ' + esc(it.name) + ' ×' + r.report.qty + ' added to your pantry'); } });
            else if (b.dataset.hat) pr = act('buy_hat', [b.dataset.hat], 'Trying it on…').then(function (r) { if (r && r.ok) { BB.Sound.play('unlock'); BB.toast('🎩 New hat: ' + esc(HATS[b.dataset.hat].name) + '!', 'gold'); badgeToasts(r.report); } });
            else pr = act('wear_hat', [b.dataset.wear], 'Trying it on…');
            pr.then(function () { renderHub('shop'); });
          });
        }
        function badgeToasts(rep) {
          (rep && rep.new_badges || []).forEach(function (k) { var b = st.catalog.badges.filter(function (x) { return x.key === k; })[0]; if (b) BB.toast(em(b.emoji) + ' Badge earned: ' + esc(b.name), 'gold'); });
        }

        // ---------- badges
        function renderBadges(panel) {
          var p = st.progress, got = Object.keys(p.badges).length;
          var html = '<div class="g-h"><div><h2>Badges</h2><p>' + got + ' of ' + st.catalog.badges.length + ' earned.</p></div></div><div class="g-grid">';
          st.catalog.badges.forEach(function (b) {
            var when = p.badges[b.key], prog = '';
            if (!when && b.stat) { var v = p.stats[b.stat] || 0; prog = '<div class="g-bar"><i style="width:' + Math.min(100, Math.round(100 * v / b.at)) + '%"></i></div><small>' + v + ' / ' + b.at + '</small>'; }
            html += '<div class="g-it g-badge ' + (when ? '' : 'locked') + '" style="cursor:default">' + em(b.emoji) + '<b>' + esc(b.name) + '</b><small>' + esc(b.desc) + '</small>' + (when ? '<small style="color:#457a35">Earned ' + esc(when) + '</small>' : prog) + '</div>';
          });
          html += '</div>';
          var s = p.stats;
          html += '<div class="g-sec">' + em('📊') + '<h3>Your stats</h3></div><div class="g-chips">' +
            [['🥩', 'Meat collected', s.meat], ['🧹', 'Pests bonked', s.pests], ['💥', 'Nests destroyed', s.nests], ['📦', 'Crates smashed', s.crates], ['🤝', 'Errands', s.errands],
              ['🏁', 'Levels finished', s.runs], ['🍳', 'Recipes cooked', s.cooked], ['🪙', 'Coins earned', s.coins_earned]]
              .map(function (x) { return '<span class="g-chip">' + em(x[0]) + esc(x[1]) + ': ' + x[2] + '</span>'; }).join('') + '</div>';
          panel.innerHTML = html;
        }

        // ---------- daily box
        function daily() {
          if (!st.daily_ready) {
            var now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1), mins = Math.round((mid - now) / 60000);
            BB.modal('<div class="g-box"><div class="bb-emoji" style="font-size:80px">📦</div><h2>Opened today!</h2><p style="font-weight:700">A fresh market box arrives in ' + Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm.</p>' +
              '<p class="bb-muted" style="font-weight:800">Streak: ' + (st.progress.daily.streak || 0) + ' day' + (st.progress.daily.streak === 1 ? '' : 's') + ' 🔥</p></div>');
            return;
          }
          var m = BB.modal('<div class="g-box"><h2>Daily market box</h2><p style="font-weight:700">Tap the box to open it!</p><div class="gift bb-emoji">🎁</div><div class="out"></div></div>');
          var gift = m.el.querySelector('.gift');
          gift.addEventListener('click', function () {
            if (gift.classList.contains('open')) return;
            gift.classList.add('open'); BB.Sound.play('unlock');
            act('claim_daily', [], 'Opening…').then(function (r) {
              if (!r || !r.ok) { m.close(); return; }
              var rep = r.report;
              gift.textContent = '📦';
              BB.Sound.play('clear');
              m.el.querySelector('.out').innerHTML = '<div class="coins" style="font-family:var(--bb-title);font-size:30px">+' + rep.coins + ' 🪙</div>' +
                '<div class="g-chips" style="justify-content:center;margin:10px 0">' + Object.keys(rep.items).map(function (k) {
                  var it = item(k); return '<span class="g-chip">' + (rep.new_items.indexOf(k) >= 0 ? '<span class="g-new">NEW</span>' : '') + em(it.emoji) + esc(it.name) + ' ×' + rep.items[k] + '</span>';
                }).join('') + '</div><p style="font-weight:800">🔥 ' + rep.streak + '-day streak' + (rep.streak > 1 ? '! Keep it going for bigger boxes.' : '. Come back tomorrow for a bonus!') + '</p>';
              badgeToasts(rep);
              m.el.querySelector('.out').insertAdjacentHTML('beforeend', '<div class="g-row"><button class="bb-btn red" data-a="ok">Into the pantry!</button></div>');
              m.el.querySelector('[data-a="ok"]').addEventListener('click', function () { m.close(); renderHub(); });
            });
          });
        }

        // ---------- settings
        function settings() {
          var m = BB.modal('<h2 style="margin-right:40px">Settings</h2><div style="display:flex;gap:14px;align-items:center;margin:12px 0"><div class="pv"></div><div><b style="font-family:var(--bb-title);font-size:20px">' + esc(st.me.name) + '</b><div class="bb-muted" style="font-weight:700">' + (st.guest ? 'Guest (this browser only)' : esc(st.me.email || '')) + '</div></div></div>' +
            (st.guest ? '<div class="g-guestbar"><span style="flex:1">Create an account to keep your progress safe.</span><button class="bb-btn small green" data-a="auth">Create account</button></div>'
              : '<form class="nm" style="display:flex;gap:8px;align-items:flex-end"><div class="bb-field" style="flex:1;margin:0"><label>Bun name</label><input class="bb-input" name="name" maxlength="24" value="' + esc(st.me.name) + '"></div><button class="bb-btn small" type="submit">Save</button></form>') +
            '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px">' +
            '<button class="bb-btn small cream" data-a="sfx">' + (BB.Sound.sfxOn ? '🔊 Sounds on' : '🔇 Sounds off') + '</button>' +
            '<button class="bb-btn small cream" data-a="music">' + (BB.Sound.musicOn ? '🎵 Music on' : '🎵 Music off') + '</button>' +
            '<button class="bb-btn small cream" data-a="howto">❓ How to play</button>' +
            (st.me.is_admin ? '<button class="bb-btn small jade" data-a="admin">🛠 Level builder</button>' : '') +
            '<button class="bb-btn small red" data-a="out">' + (st.guest ? '⏏ Back to title' : '⏏ Sign out') + '</button></div>');
          m.el.querySelector('.pv').appendChild(hatPortrait(80, st.progress.hat));
          var f = m.el.querySelector('form.nm');
          if (f) f.addEventListener('submit', function (e) {
            e.preventDefault();
            busy(true, 'Saving…');
            call('set_name', [f.elements.name.value, BB.today()]).then(function (r) {
              busy(false);
              if (r && r.ok) { apply(r); BB.toast('Name saved!'); m.close(); renderHub(); } else BB.toast(esc((r && r.error) || 'Could not save.'), 'err');
            });
          });
          m.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]'); if (!a) return; BB.Sound.play('click');
            var k = a.dataset.a;
            if (k === 'sfx') { BB.Sound.setSfx(!BB.Sound.sfxOn); a.textContent = BB.Sound.sfxOn ? '🔊 Sounds on' : '🔇 Sounds off'; }
            else if (k === 'music') { BB.Sound.setMusic(!BB.Sound.musicOn); a.textContent = BB.Sound.musicOn ? '🎵 Music on' : '🎵 Music off'; if (BB.Sound.musicOn) BB.Sound.startMusic('menu'); }
            else if (k === 'howto') howTo();
            else if (k === 'admin') emit('admin');
            else if (k === 'auth') { m.close(); authModal('signup'); }
            else if (k === 'out') {
              m.close();
              if (st.guest) { st.guest = false; renderTitle(); }
              else emit('logout').then(function () { st.signedIn = false; st.progress = null; renderTitle(); });
            }
          });
        }

        // ------------------------------------------------------------ start
        renderTitle();
        window.BB_GAME_DEBUG = { st: st, play: play, renderHub: renderHub, game: function () { return game; }, startGuest: startGuest, results: results, levelModal: levelModal };
        return { refresh: function () { return load().then(function () { if (st.screen === 'hub') renderHub(); }); } };
      });
    })();
    </script>

    <!-- ===== AdminPage component ===== -->
    <style>
      .bb-admin { position: fixed; inset: 0; display: flex; flex-direction: column; background: #efe3cf; overflow: hidden; }
      .a-login { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto;
        background: radial-gradient(circle at 50% 30%, #fff7ea, #e9d6b4); }
      .a-login .bb-card { width: 100%; max-width: 400px; padding: 24px; text-align: center; }
      .a-login h1 { font-size: 30px; margin: 6px 0 4px; }
      .a-top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bb-ink); color: #fff7ea; flex: none; flex-wrap: wrap; }
      .a-top h1 { font-size: 19px; color: #fff7ea; display: flex; align-items: center; gap: 8px; margin-right: 6px; }
      .a-top .tabs { display: flex; gap: 4px; }
      .a-top .tabs button { background: transparent; border: 2px solid transparent; color: #f3d9b0; border-radius: 10px; padding: 5px 12px; font-weight: 600; font-size: 15px; }
      .a-top .tabs button.on { background: var(--bb-gold); color: var(--bb-ink); border-color: #fff7ea; }
      .a-top .sp { flex: 1; }
      .a-top .who { font-size: 13px; color: #d9c2a0; font-weight: 700; }
      .a-body { flex: 1; display: flex; min-height: 0; }
      .a-side { width: 270px; flex: none; overflow: auto; background: #f7ecd9; border-right: 2.5px solid var(--bb-line); padding: 10px; }
      .a-terr { margin-bottom: 12px; }
      .a-terr h4 { font-size: 14px; display: flex; align-items: center; gap: 6px; margin: 4px 2px 6px; }
      .a-terr h4 .bb-emoji { font-size: 18px; }
      .a-terr h4 .n { margin-left: auto; font-family: var(--bb-font); font-weight: 800; font-size: 12px; color: var(--bb-soft); }
      .a-lv { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; margin-bottom: 3px; background: #fffaf2; }
      .a-lv:hover { border-color: var(--bb-soft); }
      .a-lv.on { border-color: var(--bb-line); background: #fff1c9; }
      .a-lv canvas { border-radius: 4px; flex: none; border: 1.5px solid var(--bb-line); }
      .a-lv .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 13px; line-height: 1.15; }
      .a-lv .nm small { display: block; font-weight: 700; color: var(--bb-soft); font-size: 11px; }
      .a-lv .mv { display: flex; flex-direction: column; }
      .a-lv .mv button { border: 0; background: transparent; padding: 0 3px; font-size: 11px; line-height: 1.1; color: var(--bb-ink-2); }
      .a-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #9a7a62; flex: none; }
      .a-dot.pub { background: #5e9c4a; } .a-dot.err { background: #e0483a; }
      .a-add { width: 100%; border: 2px dashed var(--bb-soft); background: transparent; border-radius: 10px; padding: 5px; font-weight: 600; color: var(--bb-ink-2); font-size: 13px; }
      .a-center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .a-tools { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #fff7ea; border-bottom: 2.5px solid var(--bb-line); flex-wrap: wrap; }
      .a-tools .grp { display: flex; gap: 3px; background: #efe3cf; border-radius: 12px; padding: 3px; }
      .a-tools .t { border: 2px solid transparent; background: transparent; border-radius: 9px; padding: 4px 9px; font-size: 14px; font-weight: 600; color: var(--bb-ink); }
      .a-tools .t.on { background: #fff; border-color: var(--bb-line); box-shadow: 0 2px 0 var(--bb-line); }
      .a-tools .t[disabled] { opacity: .35; }
      .a-tools .sp { flex: 1; }
      .a-tools .lvname { font-family: var(--bb-title); font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
      .a-tools .dirty { color: var(--bb-red-2); font-weight: 800; font-size: 12px; }
      .a-canvas { flex: 1; overflow: auto; position: relative; background: repeating-conic-gradient(#e3d3b8 0% 25%, #ead9be 0% 50%) 50% / 24px 24px; }
      .a-canvas canvas { display: block; margin: 24px; cursor: crosshair; box-shadow: 0 6px 0 rgba(61,36,22,.35); border: 3px solid var(--bb-line); border-radius: 6px; image-rendering: auto; }
      .a-status { padding: 4px 12px; font-size: 12.5px; font-weight: 700; color: var(--bb-ink-2); background: #fff7ea; border-top: 2px solid var(--bb-line); display: flex; gap: 14px; flex-wrap: wrap; }
      .a-right { width: 330px; flex: none; overflow: auto; background: #f7ecd9; border-left: 2.5px solid var(--bb-line); }
      .a-box { padding: 10px 12px; border-bottom: 2px solid #e2cfae; }
      .a-box h3 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
      .a-box h3 .tg { margin-left: auto; font-family: var(--bb-font); font-size: 12px; font-weight: 800; color: var(--bb-soft); cursor: pointer; }
      .a-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; }
      .a-sw { position: relative; border: 2px solid #d6c2a2; border-radius: 8px; background: #fff; padding: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 42px; }
      .a-sw:hover { border-color: var(--bb-soft); }
      .a-sw.on { border-color: var(--bb-line); box-shadow: 0 0 0 2px var(--bb-gold); }
      .a-sw canvas { pointer-events: none; }
      .a-sw .bb-emoji { font-size: 24px; }
      .a-f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
      .a-f label { font-size: 12px; font-weight: 800; color: var(--bb-ink-2); }
      .a-f input, .a-f select, .a-f textarea { border: 2px solid var(--bb-line); border-radius: 8px; padding: 5px 8px; font-size: 14px; background: #fff; font-family: var(--bb-font); }
      .a-f textarea { resize: vertical; min-height: 54px; }
      .a-row { display: flex; gap: 8px; }
      .a-row > * { flex: 1; min-width: 0; }
      .a-chk { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-bottom: 6px; cursor: pointer; }
      .a-msgs div { font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 8px; margin-bottom: 4px; }
      .a-msgs .e { background: #ffd9d4; color: #8a1f14; } .a-msgs .w { background: #fff1c9; color: #7a5200; } .a-msgs .ok { background: #d6f5c4; color: #2d5e1d; }
      .a-page { flex: 1; overflow: auto; padding: 18px; }
      .a-page .bb-card { padding: 16px; margin-bottom: 14px; max-width: 980px; }
      .a-table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; border: 2px solid var(--bb-line); border-radius: 12px; overflow: hidden; }
      .a-table th, .a-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #eadcc5; }
      .a-table th { background: var(--bb-dough); font-family: var(--bb-title); font-weight: 600; }
      .a-play { position: fixed; inset: 0; z-index: 900; background: #000; }
      .a-play canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .a-play .hud { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
      .a-play .hud span { background: rgba(255,247,234,.95); border: 2.5px solid var(--bb-line); border-radius: 99px; padding: 3px 11px; font-family: var(--bb-title); font-weight: 600; }
      .a-play .hud .sp { flex: 1; background: none; border: 0; }
      .a-play .hud button { pointer-events: auto; }
      .a-play .say { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--bb-cream); border: 3px solid var(--bb-line); border-radius: 14px; padding: 8px 14px; font-weight: 700; max-width: 90vw; }
      @media (max-width: 1000px) {
        .a-body { flex-direction: column; overflow: auto; }
        .a-side, .a-right { width: auto; border: 0; border-bottom: 2.5px solid var(--bb-line); max-height: none; }
        .a-side { max-height: 220px; }
        .a-center { min-height: 70vh; }
      }
    </style>
    <script>
    (function () {
      'use strict';
      var BB = window.BB;
      var esc = function (s) { return BB.esc(s); };

      BB.define('admin', function (root, init, emit) {
        var Art = BB.Art;
        var S = { who: null, data: null, tab: 'levels', players: null };
        var CAT = null, ITEMS = {};
        var ed = null;  // the level being edited
        var playGame = null;

        function call(fn, args) {
          return emit('call', { fn: fn, args: args || [] }).then(function (r) { return r; }, function (e) { console.error(e); return { ok: false, error: 'Server error.' }; });
        }
        function setData(d) {
          if (!d) return;
          if (d.ok === false && d.error) BB.toast(esc(d.error), 'err');
          if (!d.territories) return;
          S.data = d; CAT = d.catalog; ITEMS = {}; CAT.items.forEach(function (i) { ITEMS[i.key] = i; });
        }

        // ------------------------------------------------------------ sign in
        function start() {
          call('admin_whoami').then(function (w) {
            S.who = w;
            if (w && w.is_admin) call('admin_state').then(function (d) { setData(d); renderApp(); });
            else renderLogin();
          });
        }
        function renderLogin(msg) {
          var w = S.who || {};
          root.innerHTML = '<div class="a-login"><div class="bb-card"><div class="pv" style="display:flex;justify-content:center"></div><h1>Level Builder</h1>' +
            (w.signed_in && !w.is_admin
              ? '<p style="font-weight:700">You\'re signed in as <b>' + esc(w.email) + '</b>, which isn\'t an admin account.</p><div style="display:flex;flex-direction:column;gap:8px"><button class="bb-btn red" data-a="out">Sign in with another account</button><button class="bb-btn cream" data-a="game">Back to the game</button></div>'
              : '<p class="bb-muted" style="font-weight:700;margin:0 0 14px">Admins only. Sign in to build levels.</p><form><div class="bb-field"><label>Email</label><input class="bb-input" name="email" type="email" required autocomplete="email"></div>' +
                '<div class="bb-field"><label>Password</label><input class="bb-input" name="password" type="password" required autocomplete="current-password"></div><div class="bb-err">' + esc(msg || '') + '</div>' +
                '<button class="bb-btn red" style="width:100%" type="submit">Sign in</button></form>' +
                '<p style="font-weight:700;font-size:13px;margin:12px 0 0">First time? <a href="#" data-a="signup">Create the admin account</a> with the admin email.</p>' +
                '<p style="margin:8px 0 0"><a href="#" data-a="game" style="font-weight:700">← Back to the game</a></p>') +
            '</div></div>';
          root.querySelector('.pv').appendChild(Art.bunPortrait(96, 'toque'));
          var f = root.querySelector('form');
          if (f) f.addEventListener('submit', function (e) {
            e.preventDefault();
            var mode = f.dataset.mode || 'login';
            var v = { email: f.elements.email.value, password: f.elements.password.value };
            emit(mode, v).then(function (r) {
              if (!r || !r.ok) { root.querySelector('.bb-err').textContent = (r && r.error) || 'Could not sign in.'; return; }
              if (r.message) { BB.toast(esc(r.message)); return; }
              start();
            });
          });
          root.querySelectorAll('[data-a]').forEach(function (a) {
            a.addEventListener('click', function (e) {
              e.preventDefault();
              if (a.dataset.a === 'game') emit('game');
              else if (a.dataset.a === 'out') emit('logout').then(function () { S.who = { signed_in: false }; renderLogin(); });
              else if (a.dataset.a === 'signup') { f.dataset.mode = 'signup'; f.querySelector('button').textContent = 'Create admin account'; f.elements.password.setAttribute('autocomplete', 'new-password'); f.elements.password.minLength = 8; a.parentNode.textContent = 'Use the admin email address. Password: at least 8 characters.'; }
            });
          });
        }

        // ------------------------------------------------------------ app shell
        function renderApp() {
          root.innerHTML = '<div class="a-top"><h1><span class="bb-emoji">🛠</span>Busy Bun · Level Builder</h1><div class="tabs">' +
            [['levels', '🗺️ Levels'], ['territories', '🏮 Territories'], ['players', '👥 Players']].map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
            '</div><span class="sp"></span><span class="who">' + esc(S.who.email) + ' · ' + S.data.stats.players + ' players · ' + S.data.stats.clears + ' clears</span>' +
            '<button class="bb-btn small cream" data-a="game">▶ Open the game</button><button class="bb-btn small" data-a="out">Sign out</button></div><div class="a-body"></div>';
          root.querySelector('.a-top').addEventListener('click', function (e) {
            var t = e.target.closest('[data-tab]');
            if (t) { if (!confirmLeave()) return; S.tab = t.dataset.tab; renderApp(); return; }
            var a = e.target.closest('[data-a]'); if (!a) return;
            if (a.dataset.a === 'game') { if (confirmLeave()) emit('game'); }
            else if (a.dataset.a === 'out') { if (confirmLeave()) emit('logout').then(function () { S.who = { signed_in: false }; ed = null; renderLogin(); }); }
          });
          var body = root.querySelector('.a-body');
          if (S.tab === 'territories') renderTerritories(body);
          else if (S.tab === 'players') renderPlayers(body);
          else renderLevels(body);
        }
        function confirmLeave() { return !(ed && ed.dirty) || window.confirm('You have unsaved changes to "' + ed.name + '". Leave without saving?'); }
        window.addEventListener('beforeunload', function (e) { if (ed && ed.dirty) { e.preventDefault(); e.returnValue = ''; } });

        // ------------------------------------------------------------ levels tab
        function territoryOf(key) { return S.data.territories.filter(function (t) { return t.key === key; })[0]; }
        function openLevel(tkey, lv) {
          ed = { key: lv.key, name: lv.name, territory: tkey, published: lv.published, builtin: lv.builtin, data: JSON.parse(JSON.stringify(lv.data)),
            dirty: false, undo: [], redo: [], sel: -1, tool: 'paint', brush: ed ? ed.brush : { kind: 'tile', ch: '#' }, zoom: ed ? ed.zoom : 32, grid: ed ? ed.grid : true, serverMsgs: lv.errors ? { errors: lv.errors, warnings: lv.warnings } : null };
        }
        function blankLevel(name, tkey, w, h) {
          var tiles = [];
          for (var y = 0; y < h; y++) { var r = ''; for (var x = 0; x < w; x++) r += (x === 0 || y === 0 || x === w - 1 || y === h - 1) ? '#' : '.'; tiles.push(r); }
          return { key: null, name: name, published: false, builtin: false,
            data: { w: w, h: h, tiles: tiles, ents: [{ t: 'start', x: 1, y: 1 }, { t: 'exit', x: w - 2, y: h - 2 }], goals: { meat: 0, errands: false, nests: false }, par: 60, intro: '' } };
        }
        function renderLevels(body) {
          if (!ed) {
            var t0 = S.data.territories[0];
            if (t0 && t0.levels[0]) openLevel(t0.key, t0.levels[0]);
            else { var b = blankLevel('New level', t0 ? t0.key : null, 24, 14); openLevel(t0 ? t0.key : null, b); }
          }
          body.innerHTML = '<aside class="a-side"></aside><section class="a-center"><div class="a-tools"></div><div class="a-canvas"><canvas></canvas></div><div class="a-status"></div></section><aside class="a-right"></aside>';
          drawSide(body.querySelector('.a-side'));
          drawTools(body.querySelector('.a-tools'));
          drawRight(body.querySelector('.a-right'));
          setupCanvas(body.querySelector('.a-canvas canvas'));
          render();
        }
        function drawSide(side) {
          var html = '';
          S.data.territories.forEach(function (t) {
            html += '<div class="a-terr"><h4><span class="bb-emoji">' + esc(t.emoji) + '</span>' + esc(t.name) + (t.published ? '' : ' <small class="bb-muted">(hidden)</small>') + '<span class="n">' + t.levels.length + '</span></h4>';
            t.levels.forEach(function (l, i) {
              var on = ed && ed.key === l.key;
              html += '<div class="a-lv ' + (on ? 'on' : '') + '" data-lv="' + esc(l.key) + '" data-t="' + esc(t.key) + '"><span class="th"></span><div class="nm">' + esc(l.name) +
                '<small>' + l.data.w + '×' + l.data.h + ' · ' + (l.clears || 0) + ' clears' + (l.errors.length ? ' · <span style="color:#b8352a">' + l.errors.length + ' error' + (l.errors.length > 1 ? 's' : '') + '</span>' : '') + '</small></div>' +
                '<span class="a-dot ' + (l.errors.length ? 'err' : l.published ? 'pub' : '') + '" title="' + (l.published ? 'Published' : 'Draft') + '"></span>' +
                '<div class="mv"><button data-mv="-1" title="Move up">▲</button><button data-mv="1" title="Move down">▼</button></div></div>';
            });
            html += '<button class="a-add" data-new="' + esc(t.key) + '">+ New level</button></div>';
          });
          if (ed && !ed.key) html = '<div class="a-lv on"><div class="nm">' + esc(ed.name) + '<small>Not saved yet</small></div></div>' + html;
          html += '<p class="bb-muted" style="font-size:12px;font-weight:700;margin:6px 2px">● green = published · ● grey = draft · ● red = has errors</p>';
          side.innerHTML = html;
          side.querySelectorAll('.a-lv[data-lv]').forEach(function (row) {
            var t = territoryOf(row.dataset.t), l = t.levels.filter(function (x) { return x.key === row.dataset.lv; })[0];
            row.querySelector('.th').appendChild(Art.levelThumb(l.data, t.theme, 54));
          });
          side.onclick = function (e) {
            var mv = e.target.closest('[data-mv]');
            if (mv) { e.stopPropagation(); var row = mv.closest('[data-lv]'); call('move_level', [row.dataset.lv, +mv.dataset.mv]).then(function (d) { setData(d); drawSide(side); }); return; }
            var nw = e.target.closest('[data-new]');
            if (nw) { if (!confirmLeave()) return; newLevelModal(nw.dataset.new); return; }
            var r2 = e.target.closest('.a-lv[data-lv]');
            if (r2 && (!ed || r2.dataset.lv !== ed.key)) {
              if (!confirmLeave()) return;
              var t2 = territoryOf(r2.dataset.t), l2 = t2.levels.filter(function (x) { return x.key === r2.dataset.lv; })[0];
              openLevel(t2.key, l2); renderLevels(root.querySelector('.a-body'));
            }
          };
        }
        function newLevelModal(tkey) {
          var m = BB.modal('<h2 style="margin-right:40px">New level</h2><form style="margin-top:12px"><div class="bb-field"><label>Name</label><input class="bb-input" name="name" value="New level" required maxlength="40"></div>' +
            '<div class="bb-field"><label>Territory</label><select class="bb-input" name="t">' + S.data.territories.map(function (t) { return '<option value="' + esc(t.key) + '"' + (t.key === tkey ? ' selected' : '') + '>' + esc(t.emoji + ' ' + t.name) + '</option>'; }).join('') + '</select></div>' +
            '<div class="bb-field"><label>Size</label><select class="bb-input" name="size"><option value="20x12">Small · 20×12</option><option value="28x16" selected>Medium · 28×16</option><option value="34x20">Large · 34×20</option><option value="44x28">Huge · 44×28</option></select></div>' +
            '<button class="bb-btn red" type="submit" style="width:100%">Create</button></form>');
          var f = m.el.querySelector('form');
          f.addEventListener('submit', function (e) {
            e.preventDefault();
            var sz = f.elements.size.value.split('x');
            var b = blankLevel(f.elements.name.value.trim() || 'New level', f.elements.t.value, +sz[0], +sz[1]);
            openLevel(f.elements.t.value, b); ed.dirty = true; m.close(); renderLevels(root.querySelector('.a-body'));
          });
        }

        // ---------- tools bar
        var TOOLS = [['paint', '✏️ Paint', 'B'], ['rect', '▭ Rectangle', 'R'], ['fill', '🪣 Fill', 'F'], ['erase', '🧽 Erase', 'E'], ['select', '↖ Select', 'V']];
        function drawTools(bar) {
          bar.innerHTML = '<span class="lvname">' + esc(ed.name) + '</span><span class="dirty">' + (ed.dirty ? '● unsaved' : '') + '</span>' +
            '<div class="grp">' + TOOLS.map(function (t) { return '<button class="t ' + (ed.tool === t[0] ? 'on' : '') + '" data-tool="' + t[0] + '" title="' + t[1] + ' (' + t[2] + ')">' + t[1] + '</button>'; }).join('') + '</div>' +
            '<div class="grp"><button class="t" data-a="undo" title="Undo (Ctrl+Z)" ' + (ed.undo.length ? '' : 'disabled') + '>↶</button><button class="t" data-a="redo" title="Redo (Ctrl+Y)" ' + (ed.redo.length ? '' : 'disabled') + '>↷</button></div>' +
            '<div class="grp"><button class="t" data-a="zout" title="Zoom out">−</button><button class="t" data-a="zin" title="Zoom in">+</button><button class="t ' + (ed.grid ? 'on' : '') + '" data-a="grid" title="Grid">#</button></div>' +
            '<span class="sp"></span>' +
            '<button class="bb-btn small jade" data-a="play">▶ Playtest</button>' +
            '<button class="bb-btn small cream" data-a="dup">⧉ Duplicate</button>' +
            (ed.key ? '<button class="bb-btn small cream" data-a="del">🗑 Delete</button>' : '') +
            (ed.builtin ? '<button class="bb-btn small cream" data-a="restore" title="Put this built-in level back as it shipped">↺ Original</button>' : '') +
            '<button class="bb-btn small red" data-a="save">💾 Save</button>';
          bar.onclick = function (e) {
            var t = e.target.closest('[data-tool]');
            if (t) { ed.tool = t.dataset.tool; drawTools(bar); return; }
            var a = e.target.closest('[data-a]'); if (!a || a.disabled) return;
            var k = a.dataset.a;
            if (k === 'undo') undo(); else if (k === 'redo') redo();
            else if (k === 'zin') { ed.zoom = Math.min(64, ed.zoom + 6); render(); }
            else if (k === 'zout') { ed.zoom = Math.max(12, ed.zoom - 6); render(); }
            else if (k === 'grid') { ed.grid = !ed.grid; drawTools(bar); render(); }
            else if (k === 'save') save();
            else if (k === 'play') playtest();
            else if (k === 'dup') { var copy = { key: null, name: (ed.name + ' (copy)').slice(0, 40), published: false, builtin: false, data: JSON.parse(JSON.stringify(ed.data)) }; openLevel(ed.territory, copy); ed.dirty = true; renderLevels(root.querySelector('.a-body')); BB.toast('Copy made. Save it to keep it.'); }
            else if (k === 'del') {
              if (!window.confirm('Delete "' + ed.name + '"? Players lose its leaderboard. This can\'t be undone.')) return;
              call('delete_level', [ed.key]).then(function (d) { setData(d); ed = null; BB.toast('Level deleted.'); renderLevels(root.querySelector('.a-body')); });
            } else if (k === 'restore') {
              if (!window.confirm('Put "' + ed.name + '" back to how it shipped? Your edits to it will be lost.')) return;
              call('restore_level', [ed.key]).then(function (d) { setData(d); reopen(ed.key); BB.toast('Restored.'); });
            }
          };
        }
        function reopen(key) {
          S.data.territories.forEach(function (t) { t.levels.forEach(function (l) { if (l.key === key) openLevel(t.key, l); }); });
          renderLevels(root.querySelector('.a-body'));
        }

        // ---------- right panel: palette, inspector, settings, checks
        var PICKUP_EMOJI = { coin: '🪙', heart: '❤️', tea: '🍵', chopsticks: '🥢', postcard: '💌' };
        function swatch(kind, val, title) {
          var on = ed.brush.kind === kind && (ed.brush.ch === val || ed.brush.k === val || (kind === 'start' || kind === 'exit' || kind === 'npc') && ed.brush.kind === kind);
          return '<div class="a-sw ' + (on ? 'on' : '') + '" data-b="' + kind + '" data-v="' + esc(val || '') + '" title="' + esc(title) + '"></div>';
        }
        function drawRight(panel) {
          var th = territoryOf(ed.territory) || { theme: 'kitchen' };
          var d = ed.data, g = d.goals || {};
          var html = '<div class="a-box"><h3>🧱 Tiles</h3><div class="a-pal">' + CAT.tiles.map(function (t) { return swatch('tile', t.ch, t.name + ' (' + t.ch + ')'); }).join('') + '</div></div>' +
            '<div class="a-box"><h3>📍 Start, exit, neighbours</h3><div class="a-pal">' + swatch('start', 'start', 'Bun start') + swatch('exit', 'exit', 'Exit steamer') + swatch('npc', 'npc', 'Neighbour with an errand') +
            CAT.pickups.map(function (p) { return swatch('pickup', p.key, p.name); }).join('') + '</div></div>' +
            '<div class="a-box"><h3>🐀 Pests & nests</h3><div class="a-pal">' + CAT.pests.map(function (p) { return swatch('pest', p.key, p.name + ': ' + p.desc); }).join('') +
            CAT.pests.filter(function (p) { return p.key !== 'king'; }).map(function (p) { return swatch('nest', p.key, p.name + ' nest'); }).join('') + '</div></div>' +
            CAT.categories.map(function (c) {
              return '<div class="a-box"><h3>' + esc(c.emoji + ' ' + c.name) + '</h3><div class="a-pal">' + CAT.items.filter(function (i) { return i.cat === c.key; }).map(function (i) { return swatch('item', i.key, i.name + ' (' + i.rarity + ')'); }).join('') + '</div></div>';
            }).join('') +
            '<div class="a-box a-insp"></div>' +
            '<div class="a-box"><h3>⚙️ Level settings</h3>' +
            '<div class="a-f"><label>Name</label><input data-s="name" maxlength="40" value="' + esc(ed.name) + '"></div>' +
            '<div class="a-f"><label>Territory</label><select data-s="territory">' + S.data.territories.map(function (t) { return '<option value="' + esc(t.key) + '"' + (t.key === ed.territory ? ' selected' : '') + '>' + esc(t.emoji + ' ' + t.name) + '</option>'; }).join('') + '</select></div>' +
            '<label class="a-chk"><input type="checkbox" data-s="published"' + (ed.published ? ' checked' : '') + '> Published (players can see it)</label>' +
            '<div class="a-row"><div class="a-f"><label>Width</label><input type="number" min="8" max="64" data-s="w" value="' + d.w + '"></div><div class="a-f"><label>Height</label><input type="number" min="6" max="48" data-s="h" value="' + d.h + '"></div></div>' +
            '<div class="a-row" style="margin-bottom:8px"><button class="bb-btn small cream" data-a="resize">Resize</button><button class="bb-btn small cream" data-a="border">Wall border</button></div>' +
            '<div class="a-row"><div class="a-f"><label>Meat goal</label><input type="number" min="0" max="200" data-s="meat" value="' + (g.meat || 0) + '"></div><div class="a-f"><label>Par time (s)</label><input type="number" min="5" max="3600" data-s="par" value="' + (d.par || 60) + '"></div></div>' +
            '<label class="a-chk"><input type="checkbox" data-s="errands"' + (g.errands ? ' checked' : '') + '> Must finish every errand</label>' +
            '<label class="a-chk"><input type="checkbox" data-s="nests"' + (g.nests ? ' checked' : '') + '> Must destroy every nest</label>' +
            '<div class="a-f"><label>Intro text (shown before the level)</label><textarea data-s="intro" maxlength="400">' + esc(d.intro || '') + '</textarea></div></div>' +
            '<div class="a-box"><h3>✅ Checks</h3><div class="a-msgs"></div></div>';
          panel.innerHTML = html;
          panel.querySelectorAll('.a-sw').forEach(function (sw) {
            var c = Art.canvas(34, 34), b = sw.dataset.b, v = sw.dataset.v;
            drawBrushIcon(c.ctx, b, v, th.theme, 34);
            sw.appendChild(c.el);
          });
          drawInspector();
          drawChecks();
          panel.onclick = function (e) {
            var sw = e.target.closest('.a-sw');
            if (sw) {
              var b = sw.dataset.b, v = sw.dataset.v;
              ed.brush = b === 'tile' ? { kind: 'tile', ch: v } : { kind: b, k: v };
              if (ed.tool !== 'paint' && !(ed.tool === 'rect' || ed.tool === 'fill') || (b !== 'tile' && ed.tool !== 'paint')) ed.tool = 'paint';
              panel.querySelectorAll('.a-sw.on').forEach(function (x) { x.classList.remove('on'); }); sw.classList.add('on');
              drawTools(root.querySelector('.a-tools'));
              return;
            }
            var a = e.target.closest('[data-a]'); if (!a) return;
            if (a.dataset.a === 'resize') {
              var w = clampInt(panel.querySelector('[data-s="w"]').value, 8, 64), h = clampInt(panel.querySelector('[data-s="h"]').value, 6, 48);
              change(function () { resizeTo(w, h); }); drawRight(panel);
