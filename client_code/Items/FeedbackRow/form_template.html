<div class="a-fb-w">
  <div class="a-fb" anvil:dom-node="box">
    <div class="hd"><span class="kind" anvil:dom-node="kind"></span><span anvil:dom-node="who"></span><anvil-component type="Link" name="email_link"></anvil-component><span class="when" anvil:dom-node="when"></span></div>
    <div class="msg" anvil:dom-node="msg"></div>
    <details anvil:dom-node="details"><summary>Game details</summary><div anvil:dom-node="ctx"></div></details>
    <div class="acts">
      <anvil-component type="Button" name="read_button" prop:text="Mark read" prop:role='["bb-btn", "small", "cream"]'></anvil-component>
      <anvil-component type="Button" name="done_button" prop:text="✓ Done" prop:role='["bb-btn", "small", "green"]'></anvil-component>
      <anvil-component type="Button" name="reopen_button" prop:text="Reopen" prop:role='["bb-btn", "small", "cream"]'></anvil-component>
      <anvil-component type="Button" name="delete_button" prop:text="🗑" prop:role='["bb-btn", "small", "cream"]'></anvil-component>

  </div>
