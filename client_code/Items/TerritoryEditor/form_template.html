<div class="a-terr-w">
  <div class="bb-card a-terrcard">
    <div class="a-row">
      <label class="a-f a-f-emoji"><span>Emoji</span><anvil-component type="TextBox" name="emoji_box"></anvil-component></label>
      <label class="a-f a-f-name"><span>Name</span><anvil-component type="TextBox" name="name_box"></anvil-component></label>
      <label class="a-f"><span>Look</span><anvil-component type="DropDown" name="theme_box"></anvil-component></label>
      <label class="a-f"><span>Main pest</span><anvil-component type="DropDown" name="pest_box"></anvil-component></label>
    </div>
    <label class="a-f"><span>Blurb (on the map)</span><anvil-component type="TextBox" name="blurb_box"></anvil-component></label>
    <label class="a-f"><span>Grandma's postcard (players read it after finding the ✉️ hidden in one of these levels)</span><anvil-component type="TextArea" name="postcard_box" prop:height="90"></anvil-component></label>
    <div class="a-actions">
      <anvil-component type="CheckBox" name="published_box"></anvil-component>
      <span class="sp"></span>
      <anvil-component type="Button" name="up_button" prop:text="▲" prop:role='["bb-btn", "small", "cream"]'></anvil-component>
      <anvil-component type="Button" name="down_button" prop:text="▼" prop:role='["bb-btn", "small", "cream"]'></anvil-component>
      <anvil-component type="Button" name="delete_button" prop:text="🗑 Delete" prop:role='["bb-btn", "small", "cream"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="💾 Save" prop:role='["bb-btn", "small"]'></anvil-component>
    </div>
  </div>
</div>
