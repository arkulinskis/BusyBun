<div class="bb bb-dlg g-center">
  <div class="g-lose-pv" anvil:name="pv_box"><anvil-component type="BusyBun.Components.Portrait" name="pv" prop:size="120"></anvil-component></div>
  <h2 class="dlg-h" anvil:dom-node="title">Squished!</h2>
  <p class="g-strong" anvil:dom-node="text">The pests got the better of you this time. Every bun gets back up.</p>
  <p class="g-lose-tip" anvil:dom-node="tip" hidden></p>
  <p class="g-lose-prog" anvil:dom-node="prog" hidden></p>
  <div class="g-row g-lose-help" anvil:name="help_row"><anvil-component type="Button" name="help_button" prop:text="🧓 Try with Grandma's help (+1 ❤️ and a steam shield)" prop:role='["bb-btn", "jade"]'></anvil-component></div>
  <div class="g-row">
    <anvil-component type="Button" name="retry_button" prop:text="↻ Try again" prop:role='["bb-btn", "red"]'></anvil-component>
    <anvil-component type="Button" name="map_button" prop:text="🗺️ Map" prop:role='["bb-btn", "cream"]'></anvil-component>
  </div>
</div>
